<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo } = React;
const { createRoot } = ReactDOM;

// ─── Constants ────────────────────────────────────────────────────────────────

const ENTITY_CONFIG = {
  symptom:    { color: '#f59e0b', bg: '#16120a', lightBg: '#fffbeb', lightColor: '#b45309', label: 'Symptom' },
  repair_job: { color: '#3b82f6', bg: '#0c1a2e', lightBg: '#eff6ff', lightColor: '#1d4ed8', label: 'Repair Job' },
  repair:     { color: '#34d399', bg: '#071a12', lightBg: '#ecfdf5', lightColor: '#059669', label: 'Component (Repair)' },
  dtc_code:   { color: '#fb7185', bg: '#1c0c10', lightBg: '#fff1f2', lightColor: '#e11d48', label: 'DTC Code' },
};
const ENTITY_TYPES = ['symptom', 'repair_job', 'repair', 'dtc_code'];

// ─── Theme context ────────────────────────────────────────────────────────────
const ThemeContext = React.createContext({ theme: 'dark', toggle: () => {} });
const useTheme = () => React.useContext(ThemeContext);

function ThemeProvider({ children }) {
  const [theme, setTheme] = useState(() => localStorage.getItem('ner-theme') || 'dark');
  useEffect(() => {
    document.body.classList.toggle('light', theme === 'light');
    localStorage.setItem('ner-theme', theme);
  }, [theme]);
  const toggle = () => setTheme(t => t === 'dark' ? 'light' : 'dark');
  return <ThemeContext.Provider value={{ theme, toggle }}>{children}</ThemeContext.Provider>;
}

// Returns {bg, color} for ENTITY_CONFIG entries, theme-aware
function useEntityStyle(type) {
  const { theme } = useTheme();
  const cfg = ENTITY_CONFIG[type] || {};
  return {
    bg:    theme === 'light' ? (cfg.lightBg    || cfg.bg)    : cfg.bg,
    color: theme === 'light' ? (cfg.lightColor || cfg.color) : cfg.color,
    label: cfg.label,
  };
}

// ─── Utilities ────────────────────────────────────────────────────────────────

function topN(items, n = 10) {
  const freq = {};
  items.forEach(v => { freq[v] = (freq[v] || 0) + 1; });
  return Object.entries(freq)
    .sort((a, b) => b[1] - a[1])
    .slice(0, n)
    .map(([name, value]) => ({ name, value }));
}

function buildEntityFreqs(results) {
  const all = Object.fromEntries(ENTITY_TYPES.map(t => [t, []]));
  results.forEach(r => {
    ENTITY_TYPES.forEach(t => {
      (r.entities?.[t] || []).forEach(v => all[t].push(v.toLowerCase().trim()));
    });
  });
  return all;
}


// mode: 'symptom-job' | 'job-repair'
const MAINTENANCE_COMPONENTS = new Set([
  'oil filter', 'engine oil', 'motor oil', 'oil and filter', 'engine oil and filter',
  'air filter', 'cabin air filter', 'engine air filter',
  'wiper blade', 'wiper blades', 'windshield wiper blade', 'windshield wiper blades',
  'spark plug', 'spark plugs',
  'fuel filter',
  'transmission fluid', 'coolant', 'antifreeze', 'brake fluid', 'power steering fluid',
  'differential fluid', 'transfer case fluid',
  'tire', 'tires',
  'battery', 'serpentine belt', 'drive belt', 'timing belt',
  'pcv valve', 'breather filter',
]);

function isMaintenance(name) {
  const n = name.toLowerCase().trim();
  if (MAINTENANCE_COMPONENTS.has(n)) return true;
  // prefix match for plurals / qualified names not in the set
  for (const m of MAINTENANCE_COMPONENTS) {
    if (n.startsWith(m) || n.endsWith(m)) return true;
  }
  return false;
}

function buildSankeyData(results, topK = 8, mode = 'job-repair') {
  const freqs = buildEntityFreqs(results);

  let nodes, acc = {};

  if (mode === 'symptom-job') {
    // Only mechanical records have real customer-reported symptoms
    const mechResults = results.filter(r => r.category === 'mechanical');
    const mechFreqs = buildEntityFreqs(mechResults);
    const topS = topN(mechFreqs.symptom,    topK).map(x => x.name);
    const topJ = topN(mechFreqs.repair_job, topK).map(x => x.name);
    nodes = [
      ...topS.map(n => ({ label: n, type: 'symptom' })),
      ...topJ.map(n => ({ label: n, type: 'repair_job' })),
    ];
    const idxS = Object.fromEntries(topS.map((n, i) => [n, i]));
    const idxJ = Object.fromEntries(topJ.map((n, i) => [n, topS.length + i]));
    mechResults.forEach(r => {
      const syms = (r.entities?.symptom    || []).map(v => v.toLowerCase().trim()).filter(v => idxS[v] !== undefined);
      const jobs = (r.entities?.repair_job || []).map(v => v.toLowerCase().trim()).filter(v => idxJ[v] !== undefined);
      syms.forEach(s => jobs.forEach(j => { const k = `${idxS[s]}|${idxJ[j]}`; acc[k] = (acc[k] || 0) + 1; }));
    });
  } else if (mode === 'dtc-single-repair' || mode === 'dtc-multi-repair') {
    // Filter to records with exactly 1 DTC (single) or 2+ DTCs (multi)
    const dtcResults = results.filter(r => {
      const dtcs = (r.entities?.dtc_code || []).filter(v => v && v.trim());
      return mode === 'dtc-single-repair' ? dtcs.length === 1 : dtcs.length >= 1;
    });
    const dtcFreqs = buildEntityFreqs(dtcResults);
    const topD = topN(dtcFreqs.dtc_code, topK).map(x => x.name);
    const topP = topN(dtcFreqs.repair,   topK * 3)
      .filter(x => !isMaintenance(x.name))
      .slice(0, topK)
      .map(x => x.name);
    nodes = [
      ...topD.map(n => ({ label: n, type: 'dtc_code' })),
      ...topP.map(n => ({ label: n, type: 'repair' })),
    ];
    const idxD = Object.fromEntries(topD.map((n, i) => [n, i]));
    const idxP = Object.fromEntries(topP.map((n, i) => [n, topD.length + i]));
    dtcResults.forEach(r => {
      const dtcs  = (r.entities?.dtc_code || []).map(v => v.toLowerCase().trim()).filter(v => idxD[v] !== undefined);
      const parts = (r.entities?.repair   || []).map(v => v.toLowerCase().trim()).filter(v => idxP[v] !== undefined);
      dtcs.forEach(d => parts.forEach(p => { const k = `${idxD[d]}|${idxP[p]}`; acc[k] = (acc[k] || 0) + 1; }));
    });
  } else {
    const topJ = topN(freqs.repair_job, topK).map(x => x.name);
    const topP = topN(freqs.repair,     topK).map(x => x.name);
    nodes = [
      ...topJ.map(n => ({ label: n, type: 'repair_job' })),
      ...topP.map(n => ({ label: n, type: 'repair' })),
    ];
    const idxJ = Object.fromEntries(topJ.map((n, i) => [n, i]));
    const idxP = Object.fromEntries(topP.map((n, i) => [n, topJ.length + i]));
    results.forEach(r => {
      const jobs  = (r.entities?.repair_job || []).map(v => v.toLowerCase().trim()).filter(v => idxJ[v] !== undefined);
      const parts = (r.entities?.repair     || []).map(v => v.toLowerCase().trim()).filter(v => idxP[v] !== undefined);
      jobs.forEach(j => parts.forEach(p => { const k = `${idxJ[j]}|${idxP[p]}`; acc[k] = (acc[k] || 0) + 1; }));
    });
  }

  const rawLinks = Object.entries(acc).map(([k, value]) => {
    const [s, t] = k.split('|');
    return { source: +s, target: +t, value };
  });

  // Drop nodes with no links — they float disconnected and crowd the diagram
  const usedIdx = new Set(rawLinks.flatMap(l => [l.source, l.target]));
  const keptNodes = nodes.filter((_, i) => usedIdx.has(i));
  const remap = {};
  keptNodes.forEach((n, newI) => { remap[nodes.indexOf(n)] = newI; });
  const links = rawLinks.map(l => ({ source: remap[l.source], target: remap[l.target], value: l.value }));

  return { nodes: keptNodes, links };
}

// ─── HighlightedText ─────────────────────────────────────────────────────────

function HighlightedText({ wr, wp, entities }) {
  const { theme } = useTheme();
  const segments = useMemo(() => {
    const text = [wr ? `Work Requested: ${wr}` : '', wp ? `Work Performed: ${wp}` : ''].filter(Boolean).join('\n');
    if (!text) return [{ text: '', highlights: [] }];

    const spans = [];
    ENTITY_TYPES.forEach(type => {
      const raw = entities?.[type];
      const vals = Array.isArray(raw) ? raw : (raw ? [raw] : []);
      vals.forEach(val => {
        if (!val || typeof val !== 'string') return;
        const re = new RegExp(val.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
        let m;
        while ((m = re.exec(text)) !== null) {
          spans.push({ start: m.index, end: m.index + m[0].length, type, val: m[0] });
        }
      });
    });
    spans.sort((a, b) => a.start - b.start);

    const merged = [];
    let pos = 0;
    for (const span of spans) {
      if (span.start < pos) continue;
      if (span.start > pos) merged.push({ text: text.slice(pos, span.start), type: null });
      merged.push({ text: text.slice(span.start, span.end), type: span.type });
      pos = span.end;
    }
    if (pos < text.length) merged.push({ text: text.slice(pos), type: null });
    return merged;
  }, [wr, wp, entities]);

  return (
    <div className="text-sm leading-7 whitespace-pre-wrap text-slate-200">
      {segments.map((seg, i) => {
        if (!seg.type) return <span key={i}>{seg.text}</span>;
        const cfg = ENTITY_CONFIG[seg.type];
        const bg = theme === 'light' ? cfg.lightBg : cfg.bg;
        const color = theme === 'light' ? cfg.lightColor : cfg.color;
        return (
          <span key={i} className="entity-highlight"
            style={{ background: bg, color, border: `1px solid ${color}40` }}
            title={cfg.label}>{seg.text}</span>
        );
      })}
    </div>
  );
}

// ─── EntityPanel ─────────────────────────────────────────────────────────────

function SymptomBadge({ norm, color, bg }) {
  const changed = norm.matched && norm.canonical.toLowerCase() !== norm.raw.toLowerCase();
  return (
    <span className="inline-flex items-baseline gap-1 px-2.5 py-0.5 rounded-md text-xs font-medium"
      style={{ background: bg, color, border: `1px solid ${color}30` }}>
      <span>{norm.canonical}</span>
      {changed && (
        <span className="opacity-50 font-normal">({norm.raw})</span>
      )}
    </span>
  );
}

const CHIP_LIMIT = 10;

function ChipList({ items, bg, color, border }) {
  const [expanded, setExpanded] = React.useState(false);
  const shown = expanded ? items : items.slice(0, CHIP_LIMIT);
  const extra = items.length - CHIP_LIMIT;
  return (
    <div className="flex flex-wrap gap-1.5 items-center">
      {shown.map((v, i) => (
        <span key={i} className="px-2 py-0.5 rounded text-xs font-medium whitespace-nowrap"
          style={{ background: bg, color, border }}>
          {v}
        </span>
      ))}
      {!expanded && extra > 0 && (
        <button onClick={() => setExpanded(true)}
          className="text-xs px-2 py-0.5 rounded border transition-colors text-slate-400 border-slate-600 hover:text-slate-200 hover:border-slate-400">
          +{extra} more
        </button>
      )}
      {expanded && items.length > CHIP_LIMIT && (
        <button onClick={() => setExpanded(false)}
          className="text-xs px-2 py-0.5 rounded border transition-colors text-slate-400 border-slate-600 hover:text-slate-200 hover:border-slate-400">
          show less
        </button>
      )}
    </div>
  );
}

function RepairSection({ entities, normalized }) {
  const { theme } = useTheme();
  const cfg = ENTITY_CONFIG['repair'];
  const color   = theme === 'light' ? cfg.lightColor : cfg.color;
  const bg      = theme === 'light' ? cfg.lightBg    : cfg.bg;
  const mutedBg = theme === 'light' ? '#f1f5f9' : '#1e293b';
  const mutedColor = theme === 'light' ? '#64748b' : '#475569';

  const rawList  = (Array.isArray(entities?.repair) ? entities.repair : []).filter(Boolean);
  const normList = normalized?.repair || [];
  if (!rawList.length) return null;

  // Merge: prefer normalized PT when available, fall back to raw LLM text
  const chips = rawList.map((raw, i) => {
    const entry = normList[i];
    return entry?.pt
      ? { label: entry.pt, normalized: true }
      : { label: raw,      normalized: false };
  });

  const [expanded, setExpanded] = React.useState(false);
  const shown = expanded ? chips : chips.slice(0, CHIP_LIMIT);
  const extra = chips.length - CHIP_LIMIT;

  return (
    <div className="flex items-start gap-3">
      <span className="text-xs font-semibold shrink-0 w-24 pt-0.5" style={{ color }}>Component</span>
      <div className="flex flex-wrap gap-1.5 items-center">
        {shown.map((chip, i) => (
          <span key={i}
            className="px-2.5 py-0.5 rounded-md text-xs font-medium whitespace-nowrap"
            style={chip.normalized
              ? { background: bg, color, border: `1px solid ${color}40` }
              : { background: mutedBg, color: mutedColor, border: `1px solid ${mutedColor}40` }}
            title={chip.normalized ? undefined : 'No taxonomy match found'}>
            {chip.label}
            {!chip.normalized && <span className="ml-1 opacity-50">~</span>}
          </span>
        ))}
        {!expanded && extra > 0 && (
          <button onClick={() => setExpanded(true)}
            className="text-xs px-2 py-0.5 rounded border transition-colors text-slate-400 border-slate-600 hover:text-slate-200 hover:border-slate-400">
            +{extra} more
          </button>
        )}
        {expanded && chips.length > CHIP_LIMIT && (
          <button onClick={() => setExpanded(false)}
            className="text-xs px-2 py-0.5 rounded border transition-colors text-slate-400 border-slate-600 hover:text-slate-200 hover:border-slate-400">
            show less
          </button>
        )}
      </div>
    </div>
  );
}

const SME_HINT_LABEL = { dtc: 'DTC', component: 'Component' };

function SmeCandidateRow({ candidates, workRequested, workPerformed }) {
  const { theme } = useTheme();
  const [expanded, setExpanded]   = React.useState(null);
  const [feedback, setFeedback]   = React.useState({});  // token → 'accepted'|'rejected'|'pending'
  const [counts, setCounts]       = React.useState({});  // token → accept_count from server

  if (!candidates || candidates.length === 0) return null;
  const amberColor  = theme === 'light' ? '#b45309' : '#f59e0b';
  const amberBg     = theme === 'light' ? '#fffbeb' : '#1c1407';
  const popupBg     = theme === 'light' ? '#ffffff' : '#1e293b';
  const popupText   = theme === 'light' ? '#1e293b' : '#cbd5e1';
  const greenColor  = theme === 'light' ? '#15803d' : '#4ade80';
  const redColor    = theme === 'light' ? '#b91c1c' : '#f87171';

  async function doAccept(c) {
    setFeedback(f => ({ ...f, [c.token]: 'pending' }));
    try {
      const res = await fetch('/api/sme/accept', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          token: c.token, hint_type: c.hint_type || 'dtc', entity_type: 'dtc_code',
          context: c.context || '', source_excerpt: (workRequested + ' ' + workPerformed).slice(0, 200),
        }),
      });
      const data = await res.json();
      setFeedback(f => ({ ...f, [c.token]: 'accepted' }));
      setCounts(ct => ({ ...ct, [c.token]: data.accept_count }));
      if (data.promoted) setExpanded(null);
    } catch { setFeedback(f => ({ ...f, [c.token]: null })); }
  }

  async function doReject(c) {
    setFeedback(f => ({ ...f, [c.token]: 'pending' }));
    try {
      await fetch('/api/sme/reject', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: c.token }),
      });
      setFeedback(f => ({ ...f, [c.token]: 'rejected' }));
    } catch { setFeedback(f => ({ ...f, [c.token]: null })); }
  }

  return (
    <div className="flex items-start gap-3">
      <span className="text-xs font-semibold shrink-0 w-24 pt-0.5" style={{ color: amberColor }}>
        ⚑ SME Review
      </span>
      <div className="flex flex-wrap gap-1.5 items-center">
        {candidates.map((c, i) => {
          const typeLabel = SME_HINT_LABEL[c.hint_type] || '?';
          const fb = feedback[c.token];
          const count = counts[c.token];
          const isAccepted = fb === 'accepted';
          const isRejected = fb === 'rejected';
          const isPending  = fb === 'pending';
          return (
            <span key={i} className="relative">
              <span
                className="px-2 py-0.5 rounded-md text-xs font-medium whitespace-nowrap cursor-pointer inline-flex items-center gap-1"
                style={{
                  background: isAccepted ? (theme==='light'?'#f0fdf4':'#052e16') : isRejected ? (theme==='light'?'#fef2f2':'#1c0606') : amberBg,
                  color: isAccepted ? greenColor : isRejected ? redColor : amberColor,
                  border: `1px dashed ${isAccepted ? greenColor : isRejected ? redColor : amberColor}60`,
                  opacity: isPending ? 0.5 : 1,
                }}
                onClick={() => !isPending && setExpanded(expanded === i ? null : i)}
              >
                <span className="opacity-60 font-normal">{typeLabel}</span>
                <span>{c.token}{isAccepted ? ' ✓' : isRejected ? ' ✗' : '?'}</span>
                {isAccepted && count && <span className="opacity-60">({count}/3)</span>}
              </span>
              {expanded === i && !isRejected && (
                <div className="absolute left-0 top-7 z-10 w-80 p-3 rounded-lg text-xs shadow-xl"
                  style={{ background: popupBg, color: popupText, border: `1px solid ${amberColor}60`, lineHeight: 1.6 }}>
                  <div className="font-semibold mb-1" style={{ color: amberColor }}>
                    Possible {typeLabel} — SME review
                  </div>

              {v}

function EntityPanel({ entities, normalized, smeCandidates, loading, workRequested, workPerformed }) {

// ─── ParetoChart ─────────────────────────────────────────────────────────────

function ParetoChart({ data, color, height = 240 }) {
  const svgRef = useRef(null);
  const wrapRef = useRef(null);

  useEffect(() => {
    if (!data.length || !svgRef.current) return;
    const W = wrapRef.current?.clientWidth || 400;
    const m = { top: 12, right: 42, bottom: 72, left: 36 };
    const iw = W - m.left - m.right;
    const ih = height - m.top - m.bottom;

    const svg = d3.select(svgRef.current);
    svg.selectAll('*').remove();
    svg.attr('width', W).attr('height', height);

    const g = svg.append('g').attr('transform', `translate(${m.left},${m.top})`);

    const total = d3.sum(data, d => d.value);
    let cum = 0;
    const points = data.map(d => { cum += d.value; return { ...d, pct: cum / total * 100 }; });

    const x = d3.scaleBand().domain(data.map(d => d.name)).range([0, iw]).padding(0.25);
    const yL = d3.scaleLinear().domain([0, data[0].value * 1.1]).range([ih, 0]);
    const yR = d3.scaleLinear().domain([0, 100]).range([ih, 0]);

    // Grid lines
    g.append('g').selectAll('line').data(yL.ticks(4)).join('line')
      .attr('x1', 0).attr('x2', iw)
      .attr('y1', d => yL(d)).attr('y2', d => yL(d))
      .attr('stroke', '#1e293b').attr('stroke-width', 1);

    // Bars
    g.append('g').selectAll('rect').data(data).join('rect')
      .attr('x', d => x(d.name))
      .attr('y', d => yL(d.value))
      .attr('width', x.bandwidth())
      .attr('height', d => ih - yL(d.value))
      .attr('fill', color)
      .attr('opacity', 0.85)
      .attr('rx', 3);

    // Cumulative line
    const line = d3.line().x(d => x(d.name) + x.bandwidth() / 2).y(d => yR(d.pct)).curve(d3.curveMonotoneX);
    g.append('path').datum(points).attr('fill', 'none').attr('stroke', '#94a3b8')
      .attr('stroke-width', 2).attr('d', line);

    // Dots on line
    g.append('g').selectAll('circle').data(points).join('circle')
      .attr('cx', d => x(d.name) + x.bandwidth() / 2).attr('cy', d => yR(d.pct))
      .attr('r', 3).attr('fill', '#94a3b8');

    // 80% threshold line
    g.append('line')
      .attr('x1', 0).attr('x2', iw).attr('y1', yR(80)).attr('y2', yR(80))
      .attr('stroke', '#475569').attr('stroke-dasharray', '4,3').attr('stroke-width', 1);
    g.append('text').attr('x', iw + 4).attr('y', yR(80) + 4)
      .attr('font-size', 9).attr('fill', '#64748b').text('80%');

    // Left Y axis
    g.append('g').call(d3.axisLeft(yL).ticks(4).tickSize(0))
      .call(a => a.select('.domain').remove())
      .call(a => a.selectAll('text').attr('fill', '#64748b').attr('font-size', 9).attr('dx', -4));

    // Right Y axis
    g.append('g').attr('transform', `translate(${iw},0)`)
      .call(d3.axisRight(yR).ticks(4).tickFormat(d => d + '%').tickSize(0))
      .call(a => a.select('.domain').remove())
      .call(a => a.selectAll('text').attr('fill', '#64748b').attr('font-size', 9).attr('dx', 4));

    // X axis labels
    g.append('g').attr('transform', `translate(0,${ih})`)
      .call(d3.axisBottom(x).tickSize(0))
      .call(a => a.select('.domain').attr('stroke', '#334155'))
      .call(a => a.selectAll('text')
        .attr('fill', '#94a3b8').attr('font-size', 10)
        .attr('transform', 'rotate(-35)').attr('text-anchor', 'end')
        .attr('dx', -4).attr('dy', 4)
        .text(function() {
          const t = d3.select(this).text();
          return t.length > 16 ? t.slice(0, 14) + '…' : t;
        }));
  }, [data, color, height]);

  return (
    <div ref={wrapRef} style={{ width: '100%' }}>
      <svg ref={svgRef} style={{ width: '100%', overflow: 'visible' }} />
    </div>
  );
}

// ─── TreemapChart ─────────────────────────────────────────────────────────────

function TreemapChart({ freqs, activeTypes = ENTITY_TYPES, height = 300 }) {
  const svgRef = useRef(null);
  const wrapRef = useRef(null);

  const data = useMemo(() => {
    const children = activeTypes.flatMap(t => {
      const top = topN(freqs[t] || [], 10);
      return top.map(({ name, value }) => ({ name, value, type: t }));
    });
    return { name: 'root', children };
  }, [freqs, activeTypes]);

  useEffect(() => {
    if (!svgRef.current || !wrapRef.current) return;
    const W = wrapRef.current.clientWidth || 600;
    const H = height;
    const svg = d3.select(svgRef.current);
    svg.selectAll('*').remove();
    svg.attr('width', W).attr('height', H);

    const root = d3.hierarchy(data).sum(d => d.value).sort((a, b) => b.value - a.value);
    d3.treemap().size([W, H]).padding(3).round(true)(root);

    const leaf = svg.selectAll('g').data(root.leaves()).join('g')
      .attr('transform', d => `translate(${d.x0},${d.y0})`);

    leaf.append('rect')
      .attr('width', d => d.x1 - d.x0)
      .attr('height', d => d.y1 - d.y0)
      .attr('fill', d => ENTITY_CONFIG[d.data.type]?.color || '#64748b')
      .attr('opacity', 0.75)
      .attr('rx', 4);

    leaf.append('clipPath').attr('id', (d, i) => `tm-clip-${i}`)
      .append('rect')
        .attr('width', d => d.x1 - d.x0)
        .attr('height', d => d.y1 - d.y0);

    leaf.append('text')
      .attr('clip-path', (_, i) => `url(#tm-clip-${i})`)
      .attr('x', 5).attr('y', 14)
      .attr('font-size', d => Math.min(12, Math.max(8, (d.x1 - d.x0) / 7)))
      .attr('fill', '#fff')
      .attr('font-weight', 600)
      .text(d => {
        const w = d.x1 - d.x0;
        if (w < 32) return '';
        const label = d.data.name;
        return label.length > Math.floor(w / 7) ? label.slice(0, Math.floor(w / 7) - 1) + '…' : label;
      });

    leaf.append('text')
      .attr('clip-path', (_, i) => `url(#tm-clip-${i})`)
      .attr('x', 5).attr('y', 26)
      .attr('font-size', 9)
      .attr('fill', '#fff')
      .attr('opacity', 0.7)
      .text(d => {
        const w = d.x1 - d.x0;
        const h = d.y1 - d.y0;
        return (w > 40 && h > 30) ? d.data.value : '';
      });

    // Tooltip
    const tip = d3.select(wrapRef.current).select('.tm-tip');
    leaf.on('mouseenter', function(event, d) {
      tip.style('opacity', 1)
        .style('left', `${event.offsetX + 10}px`)
        .style('top', `${event.offsetY - 24}px`)
        .html(`<span style="color:${ENTITY_CONFIG[d.data.type]?.color}">${ENTITY_CONFIG[d.data.type]?.label}</span>: <b>${d.data.name}</b> (${d.data.value})`);
    }).on('mousemove', function(event) {
      tip.style('left', `${event.offsetX + 10}px`).style('top', `${event.offsetY - 24}px`);
    }).on('mouseleave', () => tip.style('opacity', 0));
  }, [data, activeTypes, height]);

  return (
    <div ref={wrapRef} style={{ width: '100%', position: 'relative' }}>
      <svg ref={svgRef} style={{ width: '100%', display: 'block' }} />
      <div className="tm-tip" style={{
        position: 'absolute', pointerEvents: 'none', opacity: 0, transition: 'opacity 0.1s',
        background: '#1e293b', border: '1px solid #334155', borderRadius: 6,
        padding: '4px 8px', fontSize: 11, color: '#e2e8f0', whiteSpace: 'nowrap',
      }} />
    </div>
  );
}

// Year/Make/Model — present on any sample sourced from a DMS export with real

// that only ever had aggregated WR/WP text (e.g. cd's TSV-derived records).
// Renders nothing rather than an empty pill when there's no vehicle data.
function VehiclePill({ make, model, year }) {

// ─── LiveTab ──────────────────────────────────────────────────────────────────

function LiveTab({ selectedDs, availableDs, toggleDs, clearDs, defaultMode = 'demo' }) {
  const [mode, setMode] = useState(defaultMode);          // 'demo' | 'raw'
  const [mechType, setMechType] = useState(defaultMode === 'raw' ? 'all' : 'mechanical'); // 'mechanical' | 'maintenance' | 'all'
  const [demoSamples, setDemoSamples] = useState([]);
  const [rawSamples, setRawSamples] = useState([]);
  const [filterCat, setFilterCat] = useState('all');
  const [idx, setIdx] = useState(0);
  const [editWR, setEditWR] = useState('');
  const [editWP, setEditWP] = useState('');
  const [entities, setEntities] = useState(null);
  const [normalized, setNormalized] = useState(null);
  const [smeCandidates, setSmeCandidates] = useState([]);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');
  const [showTagged, setShowTagged] = useState(false);
  const lastExtractedRef = useRef({ wr: '', wp: '' });
  const editWRRef = useRef('');
  const editWPRef = useRef('');
  const blurTimerRef = useRef(null);

  const extract = useCallback(async (s) => {
    if (!s) return;
    const wr = s.work_requested ?? '';
    const wp = s.work_performed ?? '';
    lastExtractedRef.current = { wr, wp };
    setLoading(true); setError(''); setEntities(null); setNormalized(null); setSmeCandidates([]);
    try {
      const r = await fetch('/api/extract', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ work_requested: wr, work_performed: wp }),
      });
      const data = await r.json();
      if (data.error) setError(data.error);
      setEntities(data.entities);
      setNormalized(data.normalized || {});
      setSmeCandidates(data.dtc_sme_candidates || []);
    } catch (e) {
      setError(String(e));
    } finally {
      setLoading(false);
    }
  }, []);

  const handleFieldFocus = useCallback(() => {
    clearTimeout(blurTimerRef.current);
  }, []);

  const handleFieldBlur = useCallback(() => {
    clearTimeout(blurTimerRef.current);
    blurTimerRef.current = setTimeout(() => {
      const wr = editWRRef.current;
      const wp = editWPRef.current;
      if (wr !== lastExtractedRef.current.wr || wp !== lastExtractedRef.current.wp) {
        extract({ work_requested: wr, work_performed: wp });
      }
    }, 200);
  }, [extract]);

  useEffect(() => {
    if (!selectedDs || selectedDs.size === 0) { setDemoSamples([]); return; }
    const dsParam = `?datasources=${[...selectedDs].join(',')}`;
    fetch(`/api/samples/demo${dsParam}`).then(r => r.json()).then(d => {
      setDemoSamples(d);
      if (d[0]) {
        setEditWR(d[0].work_requested ?? ''); editWRRef.current = d[0].work_requested ?? '';
        setEditWP(d[0].work_performed  ?? ''); editWPRef.current = d[0].work_performed  ?? '';
      }
      extract(d[0]);
    });
  }, [selectedDs]);

  useEffect(() => {
    if (!selectedDs || selectedDs.size === 0) { setRawSamples([]); return; }
    const dsParam = `&datasources=${[...selectedDs].join(',')}`;
    fetch(`/api/samples?n=1000&category=${mechType}${dsParam}`)
      .then(r => r.json())
      .then(d => { setRawSamples(d); setIdx(0); setEntities(null); setError(''); });
  }, [mechType, selectedDs]);

  const filteredDemo = useMemo(() =>
    filterCat === 'all' ? demoSamples : demoSamples.filter(s => s.category === filterCat),
  [demoSamples, filterCat]);

  const samples = mode === 'demo' ? filteredDemo : rawSamples;
  const sample = samples[idx] || null;

  const pickIdx = (i, sampleList) => {
    const s = (sampleList ?? samples)[i];
    setIdx(i);
    setEntities(null); setNormalized(null); setError('');
    const wr = s?.work_requested ?? ''; setEditWR(wr); editWRRef.current = wr;
    const wp = s?.work_performed  ?? ''; setEditWP(wp); editWPRef.current = wp;
    extract(s);
  };

  return (
    <div className="grid grid-cols-5 gap-4 h-full">
      {/* ── Sample browser ── */}
      <div className="col-span-2 bg-slate-800 rounded-xl p-4 flex flex-col gap-3 border border-slate-700">

        {/* Mode toggle */}
        <div className="flex rounded-lg overflow-hidden border border-slate-700 text-xs font-semibold">
          {[['demo', '🎯 Curated Demo'], ['raw', '📂 Raw RO Data']].map(([m, lbl]) => (
            <button key={m} onClick={() => {
              setMode(m); setIdx(0); setEntities(null); setError('');
              if (m === 'demo') extract(filteredDemo[0]);
            }}
              className={`flex-1 py-1.5 transition-colors ${mode === m ? 'bg-blue-600 text-white' : 'bg-slate-900 text-slate-400 hover:text-slate-200'}`}>
              {lbl}
            </button>
          ))}
        </div>

        {/* Category filter (demo mode only) */}
        {mode === 'demo' && (
          <div className="flex flex-wrap gap-1">
            {['all', ...Object.keys(CATEGORY_STYLES)].map(cat => (
              <button key={cat}
                className={`text-xs px-2 py-0.5 rounded-full border transition-colors ${filterCat === cat
                  ? 'border-blue-400 text-blue-300 bg-blue-950'
                  : 'border-slate-700 text-slate-500 hover:border-slate-500 hover:text-slate-300'}`}
                onClick={() => {
                  const next = cat === 'all' ? demoSamples : demoSamples.filter(s => s.category === cat);
                  setFilterCat(cat); setIdx(0); setEntities(null); setError('');
                  extract(next[0]);
                }}>
                {cat === 'all' ? 'All' : CATEGORY_STYLES[cat].label}
              </button>
            ))}
          </div>
        )}

        {/* Mechanical / Maintenance toggle (raw mode only) */}
        {mode === 'raw' && (
          <>
            <div className="flex rounded-lg overflow-hidden border border-slate-700 text-xs font-semibold">
              {[['mechanical', 'Mechanical'], ['maintenance', 'Maintenance'], ['all', 'All']].map(([val, lbl]) => (
                <button key={val}
                  onClick={() => setMechType(val)}
                  className={`flex-1 py-1.5 transition-colors ${mechType === val
                    ? val === 'maintenance' ? 'bg-amber-600 text-white' : 'bg-blue-600 text-white'
                    : 'bg-slate-900 text-slate-400 hover:text-slate-200'}`}>
                  {lbl}
                </button>
              ))}
            </div>
            {availableDs && availableDs.length > 0 && (
              <div className="flex items-center gap-1.5">
                <span className="text-xs text-slate-500">Sources:</span>
                <DatasourceDropdown availableDs={availableDs} selectedDs={selectedDs} toggleDs={toggleDs} clearDs={clearDs} />
              </div>
            )}
          </>
        )}

        {/* Datasource gate */}
        {selectedDs.size === 0 && (
          <div className="flex-1 flex flex-col items-center justify-center gap-4 py-6">
            <div className="text-slate-500 text-sm text-center">Select a datasource to load samples</div>
            <div className="flex flex-wrap gap-2 justify-center">
              {(availableDs || []).map(ds => (
                <button key={ds.id} onClick={() => toggleDs(ds.id)}
                  className="text-sm px-4 py-2 rounded-lg border border-slate-600 bg-slate-900 text-slate-300 hover:border-blue-500 hover:text-blue-300 font-mono transition-colors">
                  {ds.id}
                  <span className="ml-2 text-xs text-slate-500">{ds.count >= 1000 ? `${(ds.count/1000).toFixed(0)}k` : ds.count} samples</span>
                </button>
              ))}
            </div>
          </div>
        )}

        {/* Sample list */}
        {selectedDs.size > 0 && (
          <>
            <div className="flex-1 overflow-y-auto space-y-1 pr-1" style={{ maxHeight: 440 }}>
              {samples.map((s, i) => (
                <button key={s.id ?? i} onClick={() => pickIdx(i, samples)}
                  className={`w-full text-left px-3 py-2 rounded-lg text-xs transition-all ${i === idx
                    ? 'bg-blue-900 border border-blue-600 text-blue-200'
                    : 'bg-slate-900 border border-slate-700 text-slate-400 hover:border-slate-500 hover:text-slate-300'}`}>
                  <div className="flex items-center gap-1.5 flex-wrap">
                    {s.category && <CategoryPill category={s.category} />}
                    <VehiclePill make={s.make} model={s.model} year={s.year} />
                  </div>
                  <div className="font-medium truncate mt-1">{s.work_requested || '—'}</div>
                  {s.work_performed && <div className="text-slate-500 truncate mt-0.5 text-xs">{s.work_performed.slice(0, 80)}{s.work_performed.length > 80 ? '…' : ''}</div>}
                </button>
              ))}
            </div>

// ─── Parts Forecasting helpers ────────────────────────────────────────────────
// These operate purely on what a single /api/extract call returns (plus the
// raw text of other already-loaded samples) — no separate forecasting model.
// The point is to show, live, what CDK's "enrichment layer" conversation looks
// like on real RO text: does this complaint resolve to a specific part today,
// or is it a sparse/emerging signal with no part history yet?

const FORECAST_STOPWORDS = new Set([
  'the','a','an','and','or','to','of','for','on','in','at','with','is','are',
  'this','that','it','was','has','have','had','will','be','as','by','from',
  'replace','remove','install','perform','check','inspect','vehicle','client',
  'customer','states','advise','present','side','left','right','front','rear',
]);

function forecastTokens(text) {
  return (text || '')
    .toLowerCase()
    .replace(/[^a-z0-9\s]/g, ' ')
    .split(/\s+/)
    .filter(t => t.length > 2 && !FORECAST_STOPWORDS.has(t));
}

// Some datasources (notably cd) encode replaced parts as a
// "... | PARTS: Part One, Part Two" suffix on work_performed.
function extractPartsSuffix(text) {
  const m = /\|\s*PARTS:\s*(.+)$/i.exec(text || '');
  if (!m) return [];
  return m[1].split(',').map(s => s.trim()).filter(Boolean);
}

// Pure function of extracted entities — classifies what kind of forecasting
// signal this RO represents, mirroring the CDK discussion-brief cases.
function classifyForecastSignal(entities, rawText = '') {
  const parts    = entities?.repair     || [];
  const dtcs     = entities?.dtc_code   || [];
  const jobs     = entities?.repair_job || [];
  const symptoms = entities?.symptom    || [];
  // NER summarizes free text into entities and often drops the word "recall"
  // itself (e.g. "no remedy at this time" becomes just a symptom) — so this
  // has to check the ORIGINAL RO text, not the extracted entity strings.
  const looksRecall = /recall|no remedy|tsb|open campaign/i.test(rawText);

  if (parts.length > 0) {
    return {
      key: 'direct', label: 'Direct Parts Signal', color: '#34d399',
      summary: 'The complaint/correction text resolves to specific parts today.',
      action: `Forecast demand now for: ${parts.slice(0, 4).join(', ')}.`,
    };
  }
  if (dtcs.length > 0 || looksRecall) {
    return {
      key: 'emerging', label: 'Emerging / Sparse Signal', color: '#fb7185',
      summary: dtcs.length
        ? 'A DTC is present but no part has been logged against it yet.'
        : 'This reads as a recall/TSB-style event with no parts history yet.',
      action: 'Flag for monitoring — do not wait for repair volume to accumulate before tracking this.',
    };
  }
  if (jobs.length > 0 || symptoms.length > 0) {
    return {
      key: 'semantic', label: 'Semantic Match Candidate', color: '#3b82f6',
      summary: 'A symptom or repair job was extracted, but no part was named explicitly.',
      action: 'No direct part — check similar historical repairs below for likely parts.',
    };
  }
  return {
    key: 'none', label: 'No Structured Signal', color: '#64748b',
    summary: 'Nothing was extracted from this text to forecast from.',
    action: 'Not enough signal — try a different sample or edit the text.',
  };
}

// Simple token-overlap "semantic" search over whatever pool of samples is
// already loaded for this datasource — a transparent stand-in for embedding
// similarity, using only data already present in the dataset.
function findSimilarPrecedent(current, entities, pool, limit = 3) {
  const queryTokens = new Set([
    ...forecastTokens((entities?.repair_job || []).join(' ')),
    ...forecastTokens((entities?.symptom || []).join(' ')),
  ]);
  if (queryTokens.size === 0) return [];
  const scored = pool
    .filter(s => s !== current)
    .map(s => {
      const tokens = new Set(forecastTokens(`${s.work_requested} ${s.work_performed}`));
      let overlap = 0;
      queryTokens.forEach(t => { if (tokens.has(t)) overlap++; });
      return { sample: s, overlap };
    })
    .filter(x => x.overlap > 0)
    .sort((a, b) => b.overlap - a.overlap)
    .slice(0, limit);
  return scored.map(({ sample, overlap }) => ({
    sample, overlap,
    parts: extractPartsSuffix(sample.work_performed),
  }));
}

function ForecastSignalBadge({ signal }) {
  return (
    <span className="text-xs px-2.5 py-1 rounded-full font-semibold shrink-0"
      style={{ background: `${signal.color}22`, color: signal.color, border: `1px solid ${signal.color}55` }}>
      {signal.label}
    </span>
  );
}

function PartsForecastPanel({ entities, loading, error, currentSample, pool, rawText = '' }) {
  if (loading) return (
    <div className="flex items-center gap-2 text-slate-400 text-sm py-4">
      <span className="spinner" /> Running Live NER…
    </div>
  );
  if (error) return <div className="text-red-400 text-xs py-2">⚠ {error}</div>;
  if (!entities) return <div className="text-slate-500 text-sm py-2">Select a sample and run Live NER to see a parts forecast.</div>;

  const signal = classifyForecastSignal(entities, rawText);
  const parts = entities.repair || [];
  const similar = findSimilarPrecedent(currentSample, entities, pool || []);

  return (
    <div className="space-y-4">
      {/* Signal classification */}
      <div>
        <div className="flex items-center gap-2 mb-1.5">
          <span className="text-xs font-semibold text-slate-400 uppercase tracking-wider">Demand Signal</span>
          <ForecastSignalBadge signal={signal} />

        <div className="text-sm text-slate-300">{signal.summary}</div>
        <div className="text-xs text-slate-500 mt-1">→ {signal.action}</div>
      </div>

      {/* Forecasted parts */}
      <div>
        <div className="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Forecasted Parts Demand</div>
        {parts.length > 0 ? (
          <div className="flex flex-wrap gap-1.5">
            {parts.map((p, i) => (
              <span key={i} className="text-xs px-2 py-1 rounded-md bg-emerald-950 text-emerald-300 border border-emerald-800">
                {p}
              </span>
            ))}
          </div>
        ) : (
          <div className="text-xs text-slate-500">No part extracted directly from this text — see similar historical repairs below.</div>
        )}
      </div>

      {/* Similar historical precedent — the "semantic clustering" story made concrete */}
      <div>
        <div className="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">
          Similar Repairs in This Dataset
        </div>
        {similar.length === 0 ? (
          <div className="text-xs text-slate-500">
            No overlapping repair jobs or symptoms found in the currently loaded samples.
          </div>
        ) : (
          <div className="space-y-2">
            {similar.map(({ sample, overlap, parts: simParts }, i) => (
              <div key={i} className="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2">
                <div className="flex items-center justify-between gap-2">
                  <div className="text-xs text-slate-300 truncate">{sample.work_requested || sample.work_performed}</div>
                  <span className="text-[10px] text-slate-500 shrink-0">{overlap} shared term{overlap === 1 ? '' : 's'}</span>
                </div>
                {simParts.length > 0 && (
                  <div className="flex flex-wrap gap-1 mt-1.5">
                    {simParts.map((p, j) => (
                      <span key={j} className="text-[10px] px-1.5 py-0.5 rounded bg-slate-800 text-slate-400 border border-slate-700">{p}</span>
                    ))}
                  </div>
                )}
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

// ─── Technician Skill Modeling ─────────────────────────────────────────────────
// Technician *name* is never populated in the CD export, but an anonymized
// tech number, department, and op code survive on ~95% of lines. This panel
// builds a live "skill profile" for that tech number from whatever else is
// already loaded in the pool — the same technique proven in the CDK
// Technician Assignment response, running here against real extraction output
// instead of a static table.
function TechnicianSignalPanel({ currentSample, pool }) {
  if (!currentSample) return <div className="text-xs text-slate-500 py-2">Select a sample to see technician signal.</div>;

  const techNo = currentSample.tech_no;
  const dept = currentSample.department;

  if (!techNo && !dept) {
    return (
      <div className="text-xs text-slate-500 py-2">
        No technician or department field on this record — not every datasource (or every line, even in the CD export) carries one.
      </div>
    );
  }

  const sameTech = techNo ? (pool || []).filter(s => s !== currentSample && s.tech_no === techNo) : [];
  const opCodes = Array.from(new Set([currentSample.op_code, ...sameTech.map(s => s.op_code)].filter(Boolean)));

  return (
    <div className="space-y-3">
      <div className="flex items-center gap-1.5 flex-wrap">
        {techNo && (
          <span className="text-xs px-2 py-1 rounded-md bg-indigo-950 text-indigo-300 border border-indigo-800 font-mono">
            🔧 Tech #{techNo}
          </span>
        )}
        {dept && (
          <span className="text-xs px-2 py-1 rounded-md bg-slate-700 text-slate-300 border border-slate-600 font-mono">
            {dept}
          </span>
        )}
      </div>

      {!techNo ? (
        <div className="text-xs text-slate-500">
          Department is present ({dept}) but this line has no technician number — department alone still routes work, just not to a specific person.
        </div>
      ) : sameTech.length > 0 ? (
        <div>
          <div className="text-xs text-slate-400 mb-1.5">
            This technician's other work in the loaded pool ({sameTech.length} job{sameTech.length === 1 ? '' : 's'}) — a specialization profile built with zero name data:
          </div>
          <div className="space-y-1.5">
            {sameTech.map((s, i) => (
              <div key={i} className="bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 flex items-center gap-2">
                {s.op_code && <span className="text-[10px] px-1.5 py-0.5 rounded bg-indigo-950 text-indigo-300 border border-indigo-800 font-mono shrink-0">{s.op_code}</span>}
                <span className="text-xs text-slate-300 truncate">{s.work_requested || s.work_performed}</span>
              </div>
            ))}
          </div>
          {opCodes.length > 1 && (
            <div className="text-xs text-slate-500 mt-2">
              Op codes seen for this tech: {opCodes.join(', ')} — department + op-code concentration is exactly the signal that powers Technician Skill Modeling.
            </div>
          )}
        </div>
      ) : (
        <div className="text-xs text-slate-500">
          No other jobs by Tech #{techNo} found in the currently loaded pool. Switch to Raw RO Data mode (larger sample) or the cd datasource to see this technician's other work.
        </div>
      )}
    </div>
  );
}

// ─── BatchTab ─────────────────────────────────────────────────────────────────

function BatchTab({ running, setRunning, progress, setProgress, results, setResults, abortRef, selectedDs, availableDs }) {
  const { theme } = useTheme();
  const [batchSize, setBatchSize] = useState(4000);
  const [source, setSource] = useState('all');
  const [category, setCategory] = useState('balanced');

  const dsPayload = selectedDs && selectedDs.size > 0 ? [...selectedDs] : [];

  const runBatch = async () => {
    setRunning(true);
    setResults([]);
    setProgress({ completed: 0, total: batchSize });
    abortRef.current = new AbortController();

    try {
      const resp = await fetch('/api/batch/stream', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ n: batchSize, source, category, datasources: dsPayload }),
        signal: abortRef.current.signal,
      });

      const reader = resp.body.getReader();
      const dec = new TextDecoder();
      let buf = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        const lines = buf.split('\n');
        buf = lines.pop();
        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const raw = line.slice(6).trim();
          if (raw === '[DONE]') { setRunning(false); break; }
          try {
            const evt = JSON.parse(raw);
            setProgress({ completed: evt.completed, total: evt.total });
            setResults(prev => [...prev, evt.result]);
          } catch (_) {}
        }
      }
    } catch (e) {
      if (e.name !== 'AbortError') console.error(e);
    } finally {
      setRunning(false);
    }
  };

  const stop = () => { abortRef.current?.abort(); setRunning(false); };

  const pct = progress.total ? Math.round((progress.completed / progress.total) * 100) : 0;

  return (
    <div className="flex flex-col gap-4 h-full">
      {/* Controls */}
      <div className="bg-slate-800 rounded-xl p-4 border border-slate-700 flex items-center gap-6 flex-wrap">
        <div className="flex items-center gap-3">
          <label className="text-xs text-slate-400">Batch size</label>
          <input type="range" min={5} max={4000} step={5} value={batchSize} onChange={e => setBatchSize(+e.target.value)} className="w-32" />
          <span className="text-sm font-mono text-slate-200 w-14">{batchSize}</span>
        </div>
        <div className="flex items-center gap-2">
          <label className="text-xs text-slate-400">Mix</label>
          <select value={category} onChange={e => setCategory(e.target.value)} className="text-xs bg-slate-700 border border-slate-600 rounded px-2 py-1 text-slate-300">
            <option value="balanced">⚖ Balanced (50/50)</option>
            <option value="mechanical">🔧 Mechanical</option>
            <option value="maintenance">🛢 Maintenance</option>
            <option value="all">All</option>
          </select>
        </div>
        <div className="flex items-center gap-2">
          <label className="text-xs text-slate-400">Type</label>
          <select value={source} onChange={e => setSource(e.target.value)} className="text-xs bg-slate-700 border border-slate-600 rounded px-2 py-1 text-slate-300">
            <option value="all">All</option>
            <option value="labor">Labor</option>
            <option value="parts">Parts</option>
          </select>
        </div>
        {availableDs && availableDs.length > 0 && (
          <div className="flex items-center gap-2">
            <label className="text-xs text-slate-400">Datasources</label>
            <div className="flex items-center gap-1.5 flex-wrap">
              {(dsPayload.length > 0 ? dsPayload : availableDs.map(d => d.id)).map(id => {
                const ds = availableDs.find(d => d.id === id);
                return (
                  <span key={id} className="text-xs px-2 py-0.5 rounded-full border bg-blue-700 border-blue-600 text-white font-mono">
                    {id}{ds ? ` · ${ds.count >= 1000 ? `${(ds.count/1000).toFixed(0)}k` : ds.count}` : ''}
                  </span>
                );
              })}
            </div>
            <span className="text-xs text-slate-600">(change in ⚙ Settings)</span>
          </div>
        )}
        {!running
          ? <button onClick={runBatch} className="px-5 py-2 rounded-lg text-sm font-semibold bg-blue-600 hover:bg-blue-500 transition-colors">▶ Run Batch</button>
          : <button onClick={stop} className="px-5 py-2 rounded-lg text-sm font-semibold bg-red-700 hover:bg-red-600 transition-colors">■ Stop</button>
        }
        {results.length > 0 && !running && (() => {
          const mech  = results.filter(r => r.category === 'mechanical').length;
          const maint = results.filter(r => r.category === 'maintenance').length;
          return (
            <span className="text-xs text-slate-400">
              {results.length} records — <span className="text-blue-400">{mech} mech</span> · <span className="text-amber-400">{maint} maint</span>
            </span>
          );
        })()}
        {running && (
          <span className="text-xs text-blue-400 flex items-center gap-1.5 ml-auto">
            <span className="spinner" /> Running in background — switch tabs freely
          </span>
        )}
      </div>

      {/* Progress */}
      {(running || progress.completed > 0) && (
        <div className="bg-slate-800 rounded-xl p-4 border border-slate-700">
          <div className="flex items-center justify-between mb-2">
            <span className="text-xs text-slate-400">{progress.completed} / {progress.total} records</span>
            <span className="text-xs font-mono text-blue-400">{pct}%</span>
          </div>
          <div className="h-2 bg-slate-700 rounded-full overflow-hidden">
            <div className="h-2 bg-blue-500 rounded-full transition-all duration-300" style={{ width: `${pct}%` }} />
          </div>
        </div>
      )}

      {/* Live results */}
      <div className="flex-1 overflow-y-auto space-y-2 pr-1" style={{ maxHeight: 420 }}>
        {results.slice().reverse().map((r, i) => (
          <div key={i} className="bg-slate-800 rounded-lg p-3 border border-slate-700 fade-in">
            <div className="flex items-start justify-between gap-2 mb-2">
              <div className="text-xs text-slate-300 flex-1">
                {r.work_requested && <div><span className="text-slate-500">WR: </span>{r.work_requested}</div>}
                {r.work_performed && <div><span className="text-slate-500">WP: </span>{r.work_performed.slice(0, 120)}{r.work_performed.length > 120 ? '…' : ''}</div>}
              </div>
              <div className="flex items-center gap-1 shrink-0">
                <VehiclePill make={r.make} model={r.model} year={r.year} />
                {r.category && (
                  <span className={`text-xs px-1.5 py-0.5 rounded ${r.category === 'maintenance' ? 'bg-amber-900 text-amber-400' : 'bg-blue-900 text-blue-400'}`}>
                    {r.category === 'maintenance' ? 'maint' : 'mech'}
                  </span>
                )}
                <span className={`text-xs px-1.5 py-0.5 rounded ${r.status === 'ok' ? 'bg-slate-700 text-slate-300' : 'bg-red-900 text-red-400'}`}>{r.status}</span>
              </div>
            </div>
            <div className="flex flex-wrap gap-1">
              {ENTITY_TYPES.map(t =>
                (r.entities?.[t] || []).map((v, j) => (
                  <span key={`${t}-${j}`} className="px-2 py-0.5 rounded text-xs" style={{ background: theme === 'light' ? ENTITY_CONFIG[t].lightBg : ENTITY_CONFIG[t].bg, color: theme === 'light' ? ENTITY_CONFIG[t].lightColor : ENTITY_CONFIG[t].color }}>
                    {v}
                  </span>
                ))
              )}
              {ENTITY_TYPES.every(t => !(r.entities?.[t]?.length)) && (
                <span className="text-xs text-slate-600">no entities</span>
              )}
            </div>
          </div>
        ))}
        {results.length === 0 && !running && (
          <div className="text-slate-500 text-sm text-center py-12">Run a batch to see live results here.</div>
        )}
      </div>
    </div>
  );
}

// ─── AnalyticsTab ─────────────────────────────────────────────────────────────

function AnalyticsTab({ batchResults }) {
  const { theme } = useTheme();
  const [roFilter, setRoFilter] = useState('all');

  const filtered = useMemo(() =>
    roFilter === 'all' ? batchResults : batchResults.filter(r => r.category === roFilter),
  [batchResults, roFilter]);

  const freqs = useMemo(() => {
    try { return buildEntityFreqs(filtered); }
    catch(e) { console.error('buildEntityFreqs', e); return Object.fromEntries(ENTITY_TYPES.map(t => [t, []])); }
  }, [filtered]);

  const displayEntityTypes = ENTITY_TYPES;

  const coverage = displayEntityTypes.map(t => ({
    type: t,
    count: filtered.filter(r => r.entities?.[t]?.length > 0).length,
    pct: filtered.length ? Math.round(filtered.filter(r => r.entities?.[t]?.length > 0).length / filtered.length * 100) : 0,
  }));

  // Year/Make/Model — only present on records sourced from a DMS export with
  // real vehicle linkage; combined into one label rather than 3 separate charts
  // since make/model only make sense together (e.g. "Land Rover" alone is noise).
  const vehicleRecords = useMemo(() => filtered.filter(r => r.make || r.model || r.year), [filtered]);
  const vehicleFreq = useMemo(() =>
    topN(vehicleRecords.map(r => [r.year, r.make, r.model].filter(Boolean).join(' ')), 10),

  if (!batchResults.length) {
    return <div className="text-slate-500 text-sm text-center py-20">No data yet — run a batch from the Batch tab first.</div>;

  const filterBtns = [
    { val: 'all',         label: 'All',         activeClass: 'bg-slate-600 text-white border-slate-500' },
    { val: 'mechanical',  label: 'Mechanical',  activeClass: 'bg-blue-600 text-white border-blue-500' },
    { val: 'maintenance', label: 'Maintenance', activeClass: 'bg-amber-600 text-white border-amber-500' },

  return (
    <div className="space-y-4">

      {/* RO type filter */}
      <div className="flex items-center gap-3">
        <span className="text-xs text-slate-500 font-semibold uppercase tracking-wider">Filter</span>
        <div className="flex gap-1">
          {filterBtns.map(({ val, label, activeClass }) => {
            const count = val === 'all' ? batchResults.length : batchResults.filter(r => r.category === val).length;
            return (
              <button key={val} onClick={() => setRoFilter(val)}
                className={`px-3 py-1 rounded text-xs font-medium border transition-colors ${roFilter === val ? activeClass : 'border-slate-700 text-slate-400 hover:text-slate-200 hover:border-slate-500'}`}>
                {label} <span className="opacity-60 ml-1">{count}</span>
              </button>
            );
          })}
        </div>
        {roFilter !== 'all' && (
          <span className="text-xs text-slate-500">{filtered.length} of {batchResults.length} records</span>
        )}
      </div>

      {/* Coverage */}
      <div className="bg-slate-800 rounded-xl p-4 border border-slate-700">
        <div className="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">Entity Coverage — {filtered.length} records</div>
        <div className="grid grid-cols-4 gap-3">
          {coverage.map(({ type, count, pct }) => {
            const c = ENTITY_CONFIG[type];
            const bg    = theme === 'light' ? c.lightBg    : c.bg;
            const color = theme === 'light' ? c.lightColor : c.color;
            return (
              <div key={type} className="rounded-lg p-3 text-center" style={{ background: bg, border: `1px solid ${color}40` }}>
                <div className="text-2xl font-bold" style={{ color }}>{pct}%</div>
                <div className="text-xs mt-1" style={{ color }}>{c.label}</div>
                <div className="text-xs text-slate-500 mt-0.5">{count} records</div>
              </div>
            );

      </div>

      {/* Top-10 charts */}
      <div className="grid grid-cols-2 gap-4">
        {displayEntityTypes.map(t => {
          const c = ENTITY_CONFIG[t];
          const data = topN(freqs[t], 10);
          return (
            <div key={t} className="bg-slate-800 rounded-xl p-4 border border-slate-700">
              <div className="text-xs font-semibold mb-3" style={{ color: c.color }}>Top {c.label}s</div>
              <HBar data={data} color={c.color} />
            </div>
          );
        })}
      </div>

      {/* Vehicles — only shown when this batch actually has vehicle-linked records */}
      {vehicleRecords.length > 0 && (
        <div className="bg-slate-800 rounded-xl p-4 border border-slate-700">
          <div className="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">
            Top Vehicles (Year Make Model) — {vehicleRecords.length} of {filtered.length} records

// ─── PartsForecastAnalyticsTab ────────────────────────────────────────────────
// Batch-wide view of the same forecasting read the Parts Forecasting tab does
// per-record: classifyForecastSignal() run across every batch result, live —
// batchResults is the same lifted state Analytics/Shop Profile read, so this
// updates as results stream in from the Batch tab with no extra wiring.

function PartsForecastAnalyticsTab({ batchResults }) {
  const [roFilter, setRoFilter] = useState('all');

  const filtered = useMemo(() =>
    roFilter === 'all' ? batchResults : batchResults.filter(r => r.category === roFilter),
  [batchResults, roFilter]);

  const classified = useMemo(() => filtered.map(r => ({
    r,
    signal: classifyForecastSignal(r.entities, `${r.work_requested || ''} ${r.work_performed || ''}`),
  })), [filtered]);

  const counts = useMemo(() => {
    const c = { direct: 0, emerging: 0, semantic: 0, none: 0 };
    classified.forEach(({ signal }) => { c[signal.key] = (c[signal.key] || 0) + 1; });
    return c;
  }, [classified]);

  const total = filtered.length;
  const pct = n => total ? Math.round((n / total) * 100) : 0;

  const directPartsItems = useMemo(() => {
    const items = [];
    classified.forEach(({ r, signal }) => {
      if (signal.key === 'direct') (r.entities?.repair || []).forEach(p => items.push(p.toLowerCase().trim()));
    });
    return items;
  }, [classified]);
  const uniquePartsCount = useMemo(() => new Set(directPartsItems).size, [directPartsItems]);
  const forecastedPartsFreq = useMemo(() => topN(directPartsItems, 10), [directPartsItems]);

  const emergingList = useMemo(() =>
    classified.filter(({ signal }) => signal.key === 'emerging').map(({ r, signal }) => ({ ...r, _signal: signal })),
  [classified]);

  const bySource = useMemo(() => {
    const groups = {};
    classified.forEach(({ r, signal }) => {
      const ds = r.datasource || 'unknown';
      groups[ds] = groups[ds] || { datasource: ds, total: 0, direct: 0, emerging: 0 };
      groups[ds].total++;
      if (signal.key === 'direct') groups[ds].direct++;
      if (signal.key === 'emerging') groups[ds].emerging++;
    });
    return Object.values(groups).sort((a, b) => b.total - a.total);
  }, [classified]);

  if (!batchResults.length) {
    return <div className="text-slate-500 text-sm text-center py-20">No data yet — run a batch from the Batch tab first.</div>;
  }

  const filterBtns = [
    { val: 'all',         label: 'All',         activeClass: 'bg-slate-600 text-white border-slate-500' },
    { val: 'mechanical',  label: 'Mechanical',  activeClass: 'bg-blue-600 text-white border-blue-500' },
    { val: 'maintenance', label: 'Maintenance', activeClass: 'bg-amber-600 text-white border-amber-500' },
  ];

  const signalBuckets = [
    { key: 'direct',   label: 'Direct Parts Signal',      color: '#34d399', value: counts.direct },
    { key: 'emerging', label: 'Emerging / Sparse Signal',  color: '#fb7185', value: counts.emerging },
    { key: 'semantic', label: 'Semantic Match Candidate',  color: '#3b82f6', value: counts.semantic },
    { key: 'none',     label: 'No Structured Signal',      color: '#64748b', value: counts.none },
  ];
  const maxBucket = Math.max(1, ...signalBuckets.map(b => b.value));

  const cardCls = "bg-slate-800 rounded-xl p-4 border border-slate-700";

  return (
    <div className="space-y-4">

      {/* RO type filter */}
      <div className="flex items-center gap-3">
        <span className="text-xs text-slate-500 font-semibold uppercase tracking-wider">Filter</span>
        <div className="flex gap-1">
          {filterBtns.map(({ val, label, activeClass }) => {
            const count = val === 'all' ? batchResults.length : batchResults.filter(r => r.category === val).length;
            return (
              <button key={val} onClick={() => setRoFilter(val)}
                className={`px-3 py-1 rounded text-xs font-medium border transition-colors ${roFilter === val ? activeClass : 'border-slate-700 text-slate-400 hover:text-slate-200 hover:border-slate-500'}`}>
                {label} <span className="opacity-60 ml-1">{count}</span>
              </button>
            );
          })}
        </div>
        {roFilter !== 'all' && (
          <span className="text-xs text-slate-500">{filtered.length} of {batchResults.length} records</span>
        )}
      </div>

      {/* Metric cards */}
      <div className="grid grid-cols-5 gap-3">
        <MetricCard label="Analyzed" value={total.toLocaleString()} color="#94a3b8" />
        <MetricCard label="Direct Parts Signal" value={`${pct(counts.direct)}%`} sub={`${counts.direct} records`} color="#34d399" />
        <MetricCard label="Emerging / Sparse" value={`${pct(counts.emerging)}%`} sub={`${counts.emerging} records`} color="#fb7185" />
        <MetricCard label="Semantic Match Only" value={`${pct(counts.semantic)}%`} sub={`${counts.semantic} records`} color="#3b82f6" />
        <MetricCard label="Unique Forecasted Parts" value={uniquePartsCount.toLocaleString()} color="#fbbf24" />
      </div>

      <div className="grid grid-cols-2 gap-4">
        {/* Signal distribution */}
        <div className={cardCls}>
          <div className="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">Demand Signal Distribution — {total} records</div>
          <div className="space-y-2.5">
            {signalBuckets.map(b => (
              <div key={b.key} className="flex items-center gap-2 text-xs">
                <div className="w-44 shrink-0 text-slate-400 truncate">{b.label}</div>
                <div className="flex-1 bg-slate-700 rounded-full h-4 overflow-hidden">
                  <div className="h-4 rounded-full transition-all duration-500" style={{ width: `${(b.value / maxBucket) * 100}%`, background: b.color }} />
                </div>
                <div className="text-slate-400 w-16 text-right">{b.value} ({pct(b.value)}%)</div>
              </div>
            ))}
          </div>
        </div>

        {/* Top forecasted parts */}
        <div className={cardCls}>
          <div className="text-xs font-semibold uppercase tracking-wider mb-3" style={{ color: ENTITY_CONFIG.repair.color }}>
            Top Forecasted Parts — Direct Signal Only
          </div>
          <HBar data={forecastedPartsFreq} color={ENTITY_CONFIG.repair.color} emptyMsg="No direct part signals yet in this batch." />
        </div>
      </div>

      <div className="grid grid-cols-2 gap-4">
        {/* Emerging signals feed */}
        <div className={cardCls}>
          <div className="text-xs font-semibold uppercase tracking-wider mb-3" style={{ color: '#fb7185' }}>
            Emerging / Sparse Signals — {emergingList.length} flagged
          </div>
          <div className="space-y-2 overflow-y-auto pr-1" style={{ maxHeight: 320 }}>
            {emergingList.length === 0 ? (
              <div className="text-xs text-slate-500 py-6 text-center">No emerging/sparse signals in this batch.</div>
            ) : emergingList.slice(0, 30).map((r, i) => (
              <div key={i} className="bg-slate-900 border rounded-lg px-3 py-2" style={{ borderColor: '#fb718550' }}>
                <div className="flex items-center justify-between gap-2 mb-1">
                  <div className="flex items-center gap-1.5">
                    <span className="text-xs font-mono text-rose-300">{r.datasource || 'unknown'}</span>
                    <VehiclePill make={r.make} model={r.model} year={r.year} />
                  </div>
                  <span className="text-[10px] text-slate-500 truncate max-w-[40%]">{r._signal.summary}</span>
                </div>
                <div className="text-xs text-slate-300 truncate">{r.work_requested || r.work_performed}</div>
              </div>
            ))}
            {emergingList.length > 30 && <div className="text-xs text-slate-600 text-center pt-1">+ {emergingList.length - 30} more</div>}
          </div>
        </div>

        {/* Per-datasource breakdown */}
        <div className={cardCls}>
          <div className="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">Forecastability by Datasource</div>
          <ShopTable
            emptyMsg="No datasource breakdown yet."
            columns={[
              { key: 'datasource', label: 'Datasource' },
              { key: 'total', label: 'Records', align: 'right' },
              { key: 'direct', label: 'Direct %', align: 'right', render: r => `${Math.round((r.direct / r.total) * 100)}%` },
              { key: 'emerging', label: 'Emerging %', align: 'right', render: r => `${Math.round((r.emerging / r.total) * 100)}%` },
            ]}
            rows={bySource}
          />
        </div>
      </div>

    </div>
  );
}

// ─── TechnicianSkillModelTab ──────────────────────────────────────────────────
// Same live pattern as Parts Forecast Analytics: reads the shared batchResults
// state, so it updates as the Batch tab streams results in — no extra wiring.
// The point is to show technician-specific intelligence built from ACTUAL NER
// output (repair_job/symptom entities extracted per job), not just the raw
// tech number/department/op-code fields — those alone are a lookup table;
// this is what turns them into a skill profile.

function TechnicianSkillModelTab({ batchResults }) {
  const withTech = useMemo(() => batchResults.filter(r => r.tech_no), [batchResults]);

  const profiles = useMemo(() => {
    const byTech = {};
    withTech.forEach(r => {
      const key = r.tech_no;
      if (!byTech[key]) byTech[key] = { tech_no: key, depts: new Set(), opCodes: new Set(), jobs: 0, repairJobs: [], symptoms: [] };
      const p = byTech[key];
      p.jobs++;
      if (r.department) p.depts.add(r.department);
      if (r.op_code) p.opCodes.add(r.op_code);
      (r.entities?.repair_job || []).forEach(v => p.repairJobs.push(v));
      (r.entities?.symptom || []).forEach(v => p.symptoms.push(v));
    });
    return Object.values(byTech).sort((a, b) => b.jobs - a.jobs);
  }, [withTech]);

  const singleDept = profiles.filter(p => p.depts.size === 1).length;
  const totalTechs = profiles.length;
  const avgJobs = totalTechs ? (withTech.length / totalTechs).toFixed(1) : '0';

  const topByJobs = useMemo(() =>
    profiles.slice(0, 10).map(p => ({ name: `Tech #${p.tech_no}`, value: p.jobs })),
  [profiles]);

  if (!batchResults.length) {
    return <div className="text-slate-500 text-sm text-center py-20">No data yet — run a batch from the Batch tab first (include the <code className="text-slate-400">cd</code> datasource to see technician fields).</div>;
  }
  if (!withTech.length) {
    return (
      <div className="text-slate-500 text-sm text-center py-20">
        {batchResults.length} records in this batch, but none carry a technician number.<br/>
        Technician fields only exist on <code className="text-slate-400">cd</code> datasource records sourced from the raw DMS CSV — re-run a batch including <code className="text-slate-400">cd</code>.
      </div>
    );
  }

  const cardCls = "bg-slate-800 rounded-xl p-4 border border-slate-700";

  return (
    <div className="space-y-4">

      {/* Metric cards */}
      <div className="grid grid-cols-4 gap-3">
        <MetricCard label="Technicians Identified" value={totalTechs} color="#818cf8" />
        <MetricCard label="Jobs With Tech Data" value={withTech.length} sub={`of ${batchResults.length} total`} color="#38bdf8" />
        <MetricCard label="Single-Department Techs" value={`${singleDept} / ${totalTechs}`} sub="Work in exactly one dept" color="#34d399" />
        <MetricCard label="Avg Jobs / Technician" value={avgJobs} color="#fbbf24" />
      </div>

      <div className="grid grid-cols-2 gap-4">
        {/* Top technicians by job volume */}
        <div className={cardCls}>
          <div className="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">Top Technicians by Job Volume</div>
          <HBar data={topByJobs} color="#818cf8" />
        </div>

        {/* Department concentration */}
        <div className={cardCls}>
          <div className="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">Department Concentration</div>
          <div className="flex items-center justify-center h-full py-6">
            <div className="text-center">
              <div className="text-4xl font-bold text-emerald-400">{totalTechs ? Math.round(singleDept / totalTechs * 100) : 0}%</div>
              <div className="text-xs text-slate-400 mt-2">of technicians work in exactly one department</div>
              <div className="text-xs text-slate-600 mt-1">A real routing/specialization signal, not an assumption — computed live from this batch.</div>
            </div>
          </div>
        </div>
      </div>

      {/* Per-technician skill profile, built from actual NER output */}
      <div className={cardCls}>
        <div className="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">
          Technician Skill Profiles — From Extracted NER Entities
        </div>
        <ShopTable
          emptyMsg="No technician skill profiles yet."
          columns={[
            { key: 'tech_no', label: 'Tech #', render: r => `#${r.tech_no}` },
            { key: 'depts', label: 'Dept(s)', render: r => [...r.depts].join(', ') || '—' },
            { key: 'jobs', label: 'Jobs', align: 'right' },
            {
              key: 'skill', label: 'Skill Profile (NER repair jobs)',
              render: r => {
                const uniq = Array.from(new Set(r.repairJobs.map(v => v.toLowerCase().trim())));
                return uniq.length ? uniq.slice(0, 4).join(', ') + (uniq.length > 4 ? `, +${uniq.length - 4} more` : '') : '—';
              },
            },
            { key: 'opCodes', label: 'Op Codes', render: r => [...r.opCodes].slice(0, 5).join(', ') || '—' },
          ]}

      <div className="text-xs text-slate-600 text-center">

      </div>
    </div>
  );
}

// ─── SankeyChart ─────────────────────────────────────────────────────────────

function SankeyChart({ batchResults, mode = 'job-repair' }) {
  const svgRef  = useRef(null);
  const wrapRef = useRef(null);
  const { theme } = useTheme();
  // unique prefix per mode so gradient IDs don't collide between two charts on the same page
  const gradPrefix = mode;

  const topK = mode === 'symptom-job' ? 20 : 8;
  const sankeyData = useMemo(() => {
    if (!batchResults.length) return { nodes: [], links: [] };
    try { return buildSankeyData(batchResults, topK, mode); }
    catch(e) { console.error('buildSankeyData', mode, e); return { nodes: [], links: [] }; }
  }, [batchResults, mode]);

  useEffect(() => {
    if (!svgRef.current || !wrapRef.current) return;
    const svg = d3.select(svgRef.current);
    svg.selectAll('*').remove();

    const { nodes: rawNodes, links: rawLinks } = sankeyData;
    if (!rawNodes.length || !rawLinks.length) return;

    const labelColor = theme === 'light' ? '#1e293b' : '#cbd5e1';

    const W   = wrapRef.current.clientWidth || 800;
    const H   = mode === 'symptom-job' ? 680 : 500;
    const pad = { top: 28, right: 190, bottom: 16, left: 20 };

    svg.attr('width', W).attr('height', H);

    const sankeyGen = d3.sankey()
      .nodeWidth(16)
      .nodePadding(mode === 'symptom-job' ? 6 : 10)
      .extent([[pad.left, pad.top], [W - pad.right, H - pad.bottom]]);

    const { nodes, links } = sankeyGen({
      nodes: rawNodes.map(d => ({ ...d })),
      links: rawLinks.map(d => ({ ...d })),
    });

    const g = svg.append('g');

    const defs = svg.append('defs');

    const GRAD_COLORS = {
      'symptom-repair_job': ['#f59e0b', '#3b82f6'],
      'repair_job-repair':  ['#3b82f6', '#64748b'],
    };

    // Links — per-link gradients using userSpaceOnUse so they always render correctly
    const linkPaths = g.append('g')
      .selectAll('path')
      .data(links)
      .join('path')
      .attr('d', d3.sankeyLinkHorizontal())
      .attr('fill', 'none')
      .attr('stroke-width', d => Math.max(1, d.width))
      .attr('opacity', 0.25)
      .on('mouseover', function() { d3.select(this).attr('opacity', 0.6); })
      .on('mouseout',  function() { d3.select(this).attr('opacity', 0.25); });

    // Build per-link gradient after path geometry is known
    linkPaths.each(function(d, i) {
      const key = `${d.source.type}-${d.target.type}`;
      const colors = GRAD_COLORS[key] || ['#60a5fa', '#64748b'];
      const gradId = `${gradPrefix}-link-${i}`;
      const grad = defs.append('linearGradient')
        .attr('id', gradId)
        .attr('gradientUnits', 'userSpaceOnUse')
        .attr('x1', d.source.x1).attr('y1', 0)
        .attr('x2', d.target.x0).attr('y2', 0);
      grad.append('stop').attr('offset', '0%').attr('stop-color', colors[0]);
      grad.append('stop').attr('offset', '100%').attr('stop-color', colors[1]);
      d3.select(this).attr('stroke', `url(#${gradId})`);
    });

    // Nodes
    const nodeG = g.append('g').selectAll('g').data(nodes).join('g');

    nodeG.append('rect')
      .attr('x',      d => d.x0)
      .attr('y',      d => d.y0)
      .attr('width',  d => d.x1 - d.x0)
      .attr('height', d => Math.max(2, d.y1 - d.y0))
      .attr('fill',   d => ENTITY_CONFIG[d.type]?.color || '#3b82f6')
      .attr('rx', 2)
      .attr('opacity', 0.9);

    // Labels
    const rightEdge = W - pad.right;
    nodeG.append('text')
      .attr('x',           d => d.x1 >= rightEdge - 20 ? d.x0 - 8 : d.x1 + 8)
      .attr('y',           d => (d.y0 + d.y1) / 2)
      .attr('dy',          '0.35em')
      .attr('text-anchor', d => d.x1 >= rightEdge - 20 ? 'end' : 'start')
      .attr('font-size',   11)
      .attr('fill',        labelColor)
      .text(d => d.label.length > 26 ? d.label.slice(0, 24) + '…' : d.label);

    // Column headers
    const colX = {};
    nodes.forEach(n => { if (colX[n.type] === undefined || n.x0 < colX[n.type]) colX[n.type] = n.x0; });
    const colDefs = { symptom: 'SYMPTOM', repair_job: 'REPAIR JOB', repair: 'COMPONENT (REPAIR)', dtc_code: 'DTC CODE' };
    Object.entries(colDefs).forEach(([type, lbl]) => {
      if (colX[type] === undefined) return;
      svg.append('text')
        .attr('x', colX[type] + 8).attr('y', 16)
        .attr('font-size', 10).attr('font-weight', '600')
        .attr('fill', ENTITY_CONFIG[type].color)
        .attr('letter-spacing', '0.06em')
        .text(lbl);
    });
  }, [sankeyData, mode, theme]);

  if (!sankeyData.links.length) {
    const hint = mode === 'symptom-job'
      ? 'No records with both a symptom and a repair job — try a larger or Mechanical-only batch.'
      : 'No repair job → part co-occurrence found — try a larger batch.';
    return <div className="text-slate-500 text-xs py-10 text-center">{hint}</div>;
  }

  return (
    <div ref={wrapRef} style={{ width: '100%' }}>
      <svg ref={svgRef} style={{ width: '100%', overflow: 'visible' }} />
    </div>
  );
}

// ─── RelationshipsTab ─────────────────────────────────────────────────────────

  const [summaryLoading, setSummaryLoading] = useState({ mechanical: false, maintenance: false });
  const [summaryError, setSummaryError] = useState({ mechanical: '', maintenance: '' });

  const filtered = useMemo(() =>
    roFilter === 'all' ? batchResults : batchResults.filter(r => r.category === roFilter),
  [batchResults, roFilter]);

  const freqs = useMemo(() => {
    try { return buildEntityFreqs(filtered); }
    catch(e) { console.error('buildEntityFreqs', e); return Object.fromEntries(ENTITY_TYPES.map(t => [t, []])); }
  }, [filtered]);

  if (!batchResults.length) {
    return <div className="text-slate-500 text-sm text-center py-20">No data yet — run a batch from the Batch tab first.</div>;
  }

  const paretoData = topN(freqs[activeType], 15);

  const filterBtns = [
    { val: 'all',         label: 'All',         activeClass: 'bg-slate-600 text-white border-slate-500' },

    { val: 'maintenance', label: 'Maintenance', activeClass: 'bg-amber-600 text-white border-amber-500' },
  ];

  async function generateSummary(cat) {
    setSummaryLoading(prev => ({ ...prev, [cat]: true }));
    setSummaryError(prev => ({ ...prev, [cat]: '' }));
    setSummaries(prev => ({ ...prev, [cat]: '' }));
    const catResults = batchResults.filter(r => r.category === cat);
    const f = buildEntityFreqs(catResults);
    const body = {
      category: cat,
      record_count: catResults.length,
      top_symptoms:    topN(f.symptom    || [], 12).map(x => x.name),
      top_repair_jobs: topN(f.repair_job || [], 12).map(x => x.name),
      top_repairs:     topN(f.repair     || [], 12).map(x => x.name),
      top_dtcs:        topN(f.dtc_code   || [], 8).map(x => x.name),
    };
    try {
      const res = await fetch('/api/summarize', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await res.json();

      else setSummaries(prev => ({ ...prev, [cat]: data.summary }));

function fmtBig(n) {
  if (n >= 1e9) return (n / 1e9).toFixed(2) + 'B';
  if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
  return n.toFixed(0);
}
function fmtTime(sec) {
  if (sec < 60)    return sec.toFixed(1) + 's';
  if (sec < 3600)  return (sec / 60).toFixed(1) + ' min';
  if (sec < 86400) return (sec / 3600).toFixed(1) + ' hrs';
  return (sec / 86400).toFixed(1) + ' days';
}
function fmtCost(usd) {
  if (usd >= 1e6) return '$' + (usd / 1e6).toFixed(2) + 'M';
  if (usd >= 1e3) return '$' + (usd / 1e3).toFixed(1) + 'K';
  return '$' + usd.toFixed(2);
}
