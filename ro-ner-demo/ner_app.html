function PipelineTab() {
  const { theme } = useTheme();
  const cardBg = theme === 'light' ? '#f1f5f9' : '#0f172a';
  const S = PIPELINE_STATS;
  const defaultLinesPerRO = parseFloat(((S.partLines + S.laborLines) / S.uniqueROs).toFixed(2));
  const defaultUniquePct  = parseFloat((S.totalUniqueCalls / (S.partLines + S.laborLines) * 100).toFixed(2));

  const [targetROs,      setTargetROs]      = useState(100_000_000);
  const [linesPerRO,     setLinesPerRO]     = useState(defaultLinesPerRO);
  const [uniquePct,      setUniquePct]      = useState(defaultUniquePct);
  const [selectedModel,  setSelectedModel]  = useState('qwen3-32b');
  const [h100Cost,       setH100Cost]       = useState(4.29);
  const [numH100s,       setNumH100s]       = useState(1);
  const [concurrency,    setConcurrency]    = useState(40);
  const [rpsManual,      setRpsManual]      = useState(null);
  const [inputTokens,    setInputTokens]    = useState(200);
  const [outputTokens,   setOutputTokens]   = useState(50);

  const model         = MODEL_DEFS[selectedModel];
  const totalLines    = targetROs * linesPerRO;
  const uniqueCalls   = totalLines * (uniquePct / 100);
  const cacheHitPct   = 100 - uniquePct;
  const BASE_GB       = 32; // Qwen3-32B = reference model

  const perGpuRPS = model.type === 'h100'
    ? Math.max(1, Math.round(model.baseRPS * (BASE_GB / model.sizeGB) * concurrency / 8))
    : model.baseRPS;
  const perGpuRPSeff  = rpsManual !== null ? rpsManual : perGpuRPS;
  const totalRPS      = model.type === 'h100' ? perGpuRPSeff * numH100s : perGpuRPSeff;

  const secsFor = (ros) => (ros * linesPerRO * (uniquePct / 100)) / totalRPS;
  const totalSecs100M = secsFor(targetROs);
  const totalSecs1B   = secsFor(1_500_000_000);
  const scale1B       = 1_500_000_000 / Math.max(targetROs, 1);

  // Total cost is invariant to numH100s: N GPUs run N× faster but cost N× more per hour
  const costFor = (ros) => {
    const calls = ros * linesPerRO * (uniquePct / 100);
    if (model.type === 'h100') return (calls / perGpuRPSeff / 3600) * h100Cost;
    const perCall = (inputTokens * model.inputCostPer1M + outputTokens * model.outputCostPer1M) / 1_000_000;
    return calls * perCall;
  };
  const cost100M      = costFor(targetROs);
  const cost1B        = costFor(1_500_000_000);
  const hourlySpend   = model.type === 'h100' ? h100Cost * numH100s : null;

  // How many H100s needed to finish within a target window (10-day POC default)
  const pocTargetDays = 8;
  const gpusFor10Days = model.type === 'h100'
    ? Math.ceil(uniqueCalls / (perGpuRPSeff * pocTargetDays * 86400))
    : null;

  // All-model ETA comparison — scales with numH100s for H100 models
  const allCalcs = Object.entries(MODEL_DEFS).map(([id, m]) => {
    const perGpu = m.type === 'h100' ? Math.max(1, Math.round(m.baseRPS * (BASE_GB / m.sizeGB) * concurrency / 8)) : m.baseRPS;
    const rps = m.type === 'h100' ? perGpu * numH100s : perGpu;
    return { id, ...m, rps, secs: uniqueCalls / rps, secs1B: uniqueCalls * scale1B / rps };
  });
  const maxSecs = Math.max(...allCalcs.map(m => m.secs));

  return (
    <div className="space-y-4">
      <PipelineDiagram uniqueCalls={uniqueCalls} totalLines={totalLines} />

      <div className="grid grid-cols-5 gap-4">

        {/* ── Config ── */}
        <div className="col-span-2 bg-slate-800 rounded-xl p-4 border border-slate-700 space-y-4">
          <div className="text-xs font-semibold text-slate-400 uppercase tracking-wider">Configuration</div>

          {/* Scale presets */}
          <div>
            <div className="text-xs text-slate-500 font-semibold uppercase tracking-wide mb-2">Scale</div>
            <div className="flex gap-1.5 mb-3">
              {[[100_000_000,'100M'],[476_637_015,'476M (actual)'],[1_500_000_000,'1.5B']].map(([n, lbl]) => (
                <button key={n} onClick={() => setTargetROs(n)}
                  className={`flex-1 py-1.5 rounded text-xs font-medium border transition-colors ${
                    targetROs === n ? 'border-blue-500 bg-blue-950 text-blue-300' : 'border-slate-600 text-slate-400 hover:border-slate-500'
                  }`}>{lbl}</button>
              ))}
            </div>
            <div className="space-y-2.5">
              <SliderRow label="Target ROs" hint="repair orders" value={targetROs} min={10_000_000} max={1_500_000_000} step={10_000_000} onChange={setTargetROs} fmt={v => fmtBig(v)} />
              <SliderRow label="Lines / RO" hint="labor + parts avg" value={linesPerRO} min={1} max={8} step={0.1} onChange={setLinesPerRO} fmt={v => v.toFixed(1)} />
              <div>
                <div className="flex items-center justify-between mb-1">
                  <span className="text-xs text-slate-400">Unique call % <span className="text-slate-600">(after cache)</span></span>
                  <div className="flex gap-1">
                    <button onClick={() => setUniquePct(defaultUniquePct)}
                      className={`text-xs px-1.5 py-0.5 rounded border transition-colors ${Math.abs(uniquePct - defaultUniquePct) < 0.1 ? 'border-blue-500 bg-blue-950 text-blue-300' : 'border-slate-600 text-slate-500 hover:border-slate-500'}`}>
                      Smart cache
                    </button>
                    <button onClick={() => setUniquePct(100)}
                      className={`text-xs px-1.5 py-0.5 rounded border transition-colors ${uniquePct === 100 ? 'border-amber-500 bg-amber-950 text-amber-300' : 'border-slate-600 text-slate-500 hover:border-slate-500'}`}>
                      0% cache
                    </button>
                  </div>
                </div>
                <SliderRow label="" hint={`${cacheHitPct.toFixed(1)}% cache hit`} value={uniquePct} min={1} max={100} step={0.1} onChange={setUniquePct} fmt={v => v.toFixed(1) + '%'} />
              </div>
            </div>
          </div>

          {/* Model selector */}
          <div>
            <div className="text-xs text-slate-500 font-semibold uppercase tracking-wide mb-2">Model</div>
            <div className="grid grid-cols-2 gap-1.5">
              {Object.entries(MODEL_DEFS).map(([id, m]) => (
                <button key={id} onClick={() => setSelectedModel(id)}
                  className="p-2 rounded-lg text-left border transition-all"
                  style={selectedModel === id
                    ? { borderColor: m.color, background: m.color + '15' }
                    : { borderColor: '#334155' }}>
                  <div className="flex items-center justify-between mb-0.5">
                    <span className="text-xs font-semibold" style={{ color: selectedModel === id ? m.color : '#94a3b8' }}>{m.name}</span>
                    <span className="text-xs px-1.5 rounded" style={{ background: m.color + '25', color: m.color }}>{m.tag}</span>
                  </div>
                  <div className="text-xs text-slate-500 leading-tight">{m.desc}</div>
                </button>
              ))}
            </div>
          </div>

          {/* H100 params */}
          {model.type === 'h100' && (
            <div className="space-y-2.5">
              <div className="text-xs text-slate-500 font-semibold uppercase tracking-wide">H100 Config</div>
              <SliderRow label="# H100 GPUs" hint="parallel VMs" value={numH100s} min={1} max={32} step={1} onChange={setNumH100s} fmt={v => v + ' GPU' + (v > 1 ? 's' : '')} />
              <SliderRow label="VM cost" hint="per GPU · LambdaLabs" value={h100Cost} min={1} max={20} step={0.01} onChange={setH100Cost} fmt={v => '$' + v.toFixed(2) + '/hr'} />
              <SliderRow label="Concurrency" hint="vLLM batch size" value={concurrency} min={1} max={64} step={1} onChange={setConcurrency} fmt={v => v + ' req'} />
              <div className="text-xs bg-slate-900 rounded px-3 py-2 space-y-1">
                <div className="text-slate-500">
                  Model: <span className="text-slate-300">{model.sizeGB} GB FP8</span> · {80 - model.sizeGB} GB VRAM free · {numH100s} × H100 80GB
                </div>
                <div className="text-slate-500">
                  Total throughput: <span className="text-slate-300">{totalRPS} RPS</span>
                  <span className="text-slate-600"> ({perGpuRPSeff} × {numH100s})</span>
                </div>
                <div className="text-slate-500">
                  Hourly spend: <span className="text-slate-300">${(h100Cost * numH100s).toFixed(2)}/hr</span>
                </div>
              </div>
            </div>
          )}

          {/* Foundry params */}
          {model.type === 'foundry' && (
            <div className="space-y-2.5">
              <div className="text-xs text-slate-500 font-semibold uppercase tracking-wide">Token Config</div>
              <SliderRow label="Input tokens" hint="per NER call" value={inputTokens} min={50} max={600} step={10} onChange={setInputTokens} fmt={v => v + ' tok'} />
              <SliderRow label="Output tokens" hint="per NER call" value={outputTokens} min={20} max={200} step={5} onChange={setOutputTokens} fmt={v => v + ' tok'} />
              <div className="flex gap-4 text-xs text-slate-500 bg-slate-900 rounded px-3 py-1.5">
                <span>In: <span className="text-slate-300">${model.inputCostPer1M}/1M</span></span>
                <span>Out: <span className="text-slate-300">${model.outputCostPer1M}/1M</span></span>
              </div>
            </div>
          )}

          {/* RPS override */}
          <div>
            <div className="flex items-center justify-between mb-1.5">
              <div className="text-xs text-slate-500 font-semibold uppercase tracking-wide">Throughput</div>
              {rpsManual !== null && (
                <button onClick={() => setRpsManual(null)} className="text-xs text-blue-400 hover:text-blue-300">↺ auto ({perGpuRPS} RPS)</button>
              )}
            </div>
            <SliderRow label={rpsManual !== null ? 'RPS (manual)' : 'RPS (auto)'}
              hint={rpsManual === null ? 'derived from model + concurrency' : 'override active'}
              value={rpsManual !== null ? rpsManual : perGpuRPS}
              min={1} max={200} step={1}
              onChange={v => setRpsManual(v)}
              fmt={v => v + ' req/s'} />
          </div>
        </div>

        {/* ── Results ── */}
        <div className="col-span-3 flex flex-col gap-4">

          {/* Key metrics row */}
          <div className="bg-slate-800 rounded-xl p-4 border border-slate-700">
            <div className="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">
              Pipeline Metrics · {fmtBig(targetROs)} ROs · {model.name}
            </div>
            <div className="grid grid-cols-3 gap-3">
              <MetricCard label="Total Lines" value={fmtBig(totalLines)} sub={`${linesPerRO.toFixed(1)} lines/RO`} color="#64748b" />
              <MetricCard label="Unique NER Calls" value={fmtBig(uniqueCalls)} sub={`${cacheHitPct.toFixed(1)}% saved by cache`} color="#3b82f6" />
              <MetricCard label="Total Throughput" value={totalRPS + ' RPS'} sub={model.type === 'h100' ? `${numH100s} GPU${numH100s>1?'s':''} × ${perGpuRPSeff} RPS` : 'API parallelism'} color={model.color} />
            </div>
          </div>

          {/* Cost breakdown */}
          <div className="bg-slate-800 rounded-xl p-4 border border-slate-700">
            <div className="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">Cost Breakdown</div>
            <div className="grid grid-cols-2 gap-3 mb-3">
              <div className="rounded-lg p-4" style={{ background: cardBg, border: `1px solid ${model.color}50` }}>
                <div className="text-3xl font-bold font-mono mb-1" style={{ color: model.color }}>{fmtCost(cost100M)}</div>
                <div className="text-xs text-slate-400">{fmtBig(targetROs)} ROs total</div>
                <div className="text-xs text-slate-500 mt-1">per RO: {fmtCost(cost100M / Math.max(targetROs, 1))}</div>
                {model.type === 'h100'
                  ? <div className="text-xs text-slate-500">{fmtTime(totalSecs100M)} compute</div>
                  : <div className="text-xs text-slate-500">{fmtBig(uniqueCalls * inputTokens)} in · {fmtBig(uniqueCalls * outputTokens)} out tokens</div>
                }
              </div>
              <div className="rounded-lg p-4" style={{ background: cardBg, border: '1px solid #f59e0b40' }}>
                <div className="text-3xl font-bold font-mono mb-1 text-amber-400">{fmtCost(cost1B)}</div>
                <div className="text-xs text-slate-400">1.5 Billion ROs (projected)</div>
                <div className="text-xs text-slate-500 mt-1">per RO: {fmtCost(cost1B / 1_500_000_000)}</div>
                {model.type === 'h100'
                  ? <div className="text-xs text-slate-500">{fmtTime(totalSecs1B)} compute</div>
                  : <div className="text-xs text-slate-500">{fmtBig(uniqueCalls * scale1B * inputTokens)} in tokens</div>
                }
              </div>
            </div>

            {/* Detail breakdown */}
            {model.type === 'h100' ? (
              <div className="grid grid-cols-4 gap-2 text-xs">
                {[
                  ['GPUs',          numH100s + ' × H100',                                  '$' + (h100Cost * numH100s).toFixed(2) + '/hr total'],
                  ['Per GPU cost',  '$' + h100Cost.toFixed(2) + '/hr',                     'H100 80GB · LambdaLabs'],
                  ['Wall-clock',    fmtTime(totalSecs100M),                                 'at ' + totalRPS + ' total RPS'],
                  ['Total cost',    fmtCost(cost100M),                                      'invariant to GPU count'],
                ].map(([k, v, s]) => (
                  <div key={k} className="bg-slate-900 rounded p-2">
                    <div className="text-slate-500">{k}</div>
                    <div className="text-slate-200 font-mono font-semibold">{v}</div>
                    <div className="text-slate-600">{s}</div>
                  </div>
                ))}
              </div>
            ) : (
              <div className="grid grid-cols-2 gap-2 text-xs">
                {[
                  ['Input cost',  fmtCost(uniqueCalls * inputTokens * model.inputCostPer1M / 1_000_000),
                    fmtBig(uniqueCalls * inputTokens) + ' tok × $' + model.inputCostPer1M + '/1M'],
                  ['Output cost', fmtCost(uniqueCalls * outputTokens * model.outputCostPer1M / 1_000_000),
                    fmtBig(uniqueCalls * outputTokens) + ' tok × $' + model.outputCostPer1M + '/1M'],
                ].map(([k, v, s]) => (
                  <div key={k} className="bg-slate-900 rounded p-2">
                    <div className="text-slate-500">{k}</div>
                    <div className="text-slate-200 font-mono font-semibold">{v}</div>
                    <div className="text-slate-600">{s}</div>
                  </div>
                ))}
              </div>
            )}
          </div>

          {/* ETA section */}
          <div className="bg-slate-800 rounded-xl p-4 border border-slate-700">
            <div className="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">ETA Projection</div>

            {/* Your config — live, reflects numH100s + concurrency */}
            <div className="rounded-lg p-3 mb-4" style={{ background: cardBg, border: `1px solid ${model.color}50` }}>
              <div className="text-xs text-slate-500 mb-2 uppercase tracking-wide font-semibold">Your Configuration</div>
              <div className="grid grid-cols-3 gap-3 text-center">
                <div>
                  <div className="text-lg font-bold font-mono" style={{ color: model.color }}>{fmtTime(totalSecs100M)}</div>
                  <div className="text-xs text-slate-500 mt-0.5">{fmtBig(targetROs)} ROs</div>
                </div>
                <div>
                  <div className="text-lg font-bold font-mono text-amber-400">{fmtTime(totalSecs1B)}</div>
                  <div className="text-xs text-slate-500 mt-0.5">1.5B ROs projected</div>
                </div>
                <div>
                  <div className="text-lg font-bold font-mono text-slate-300">{totalRPS} RPS</div>
                  <div className="text-xs text-slate-500 mt-0.5">
                    {model.type === 'h100'
                      ? `${numH100s} GPU${numH100s > 1 ? 's' : ''} × ${perGpuRPSeff} RPS`
                      : 'API parallelism'}
                  </div>
                </div>
              </div>
            </div>

            {/* Model comparison — fixed 1 GPU, for cross-model reference */}
            <div className="text-xs text-slate-500 mb-2 uppercase tracking-wide font-semibold">
              Model Comparison <span className="normal-case font-normal text-slate-600">— {numH100s} GPU{numH100s > 1 ? 's' : ''} · concurrency={concurrency} · {fmtBig(uniqueCalls)} unique calls</span>
            </div>
            <div className="space-y-2 mb-4">
              {allCalcs.map(m => (
                <ETABar key={m.id} label={m.name} seconds={m.secs} maxSeconds={maxSecs} color={m.color} />
              ))}
            </div>
            <div className="border-t border-slate-700 pt-3 grid grid-cols-2 gap-6 text-xs">
              <div>
                <div className="text-slate-400 font-semibold mb-2">{fmtBig(targetROs)} ROs · {numH100s} GPU{numH100s > 1 ? 's' : ''}</div>
                {allCalcs.map(m => (
                  <div key={m.id} className="flex justify-between py-0.5 border-b border-slate-800">
                    <span style={{ color: m.color }}>{m.name}</span>
                    <span className="font-mono text-slate-300">{fmtTime(m.secs)}</span>
                  </div>
                ))}
              </div>
              <div>
                <div className="text-amber-400 font-semibold mb-2">1.5B ROs · {numH100s} GPU{numH100s > 1 ? 's' : ''}</div>
                {allCalcs.map(m => (
                  <div key={m.id} className="flex justify-between py-0.5 border-b border-slate-800">
                    <span style={{ color: m.color }}>{m.name}</span>
                    <span className="font-mono text-slate-300">{fmtTime(m.secs1B)}</span>
                  </div>
                ))}
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>
  );
}

// ─── Shop Profile: "From Batch NER" client-side aggregation ─────────────────

const CS_SEASON_DEFS = [
  { name: 'Winter', range: 'Dec–Feb', months: new Set([12, 1, 2]) },
  { name: 'Spring', range: 'Mar–May', months: new Set([3, 4, 5]) },
  { name: 'Summer', range: 'Jun–Aug', months: new Set([6, 7, 8]) },
  { name: 'Fall',   range: 'Sep–Nov', months: new Set([9, 10, 11]) },
];
const CS_MIN_SAMPLE_FOR_INDEX = 5;

function countBy(items) {
  const c = {};
  items.forEach(v => { c[v] = (c[v] || 0) + 1; });
  return c;
}

function monthOf(isoTs) {
  // parse the month straight out of the ISO string — avoids `new Date()` shifting
  // the day near midnight due to local-timezone interpretation of a naive timestamp
  return isoTs ? parseInt(isoTs.slice(5, 7), 10) : null;
}

// LLM-normalized part names ("oil filter") rarely match the catalog's fuller
// canonical names ("engine oil filter") exactly — fall back to a singular/plural
// and substring match (picking the longest, most specific catalog hit) before
// giving up and showing "—".
function lookupPartPricing(name, partsCatalog) {
  if (!partsCatalog) return {};
  if (partsCatalog[name]) return partsCatalog[name];
  const singular = name.endsWith('s') ? name.slice(0, -1) : name;
  if (partsCatalog[singular]) return partsCatalog[singular];

  let best = null;
  for (const key of Object.keys(partsCatalog)) {
    if (key.includes(singular) || singular.includes(key)) {
      if (!best || key.length > best.length) best = key;
    }
  }
  return best ? partsCatalog[best] : {};
}

function csTopParts(names, n, partsCatalog) {
  return topN(names, n).map(d => {
    const cat = lookupPartPricing(d.name, partsCatalog);
    return {
      name: d.name,
      preferred_supplier: cat.preferred_supplier ?? '—',
      avg_price: cat.avg_price ?? null,
      margin_pct: cat.margin_pct ?? null,
      qty_sold: d.value,
    };
  });
}

function csSeasonalLift(seasonItemsByType, totalCountByType, totalNByType) {
  // seasonItemsByType / totalCountByType: {type: {name: count}}, totalNByType: {type: n}
  const candidates = [];
  for (const type of Object.keys(totalCountByType)) {
    const seasonCounts = seasonItemsByType[type] || {};
    Object.entries(totalCountByType[type]).forEach(([name, totalC]) => {
      if (totalC < CS_MIN_SAMPLE_FOR_INDEX) return;
      const seasonC = seasonCounts[name] || 0;
      const overallShare = totalC / totalNByType[type];
      const seasonShare = totalNByType[`${type}_season`] ? seasonC / totalNByType[`${type}_season`] : 0;
      const index = overallShare ? seasonShare / overallShare : 0;
      if (index > 1.15 && seasonC >= 2) {
        candidates.push({ type, name, index: Math.round(index * 100) / 100, count: seasonC });
      }
    });
  }
  return candidates.sort((a, b) => b.index - a.index).slice(0, 5);
}

function buildBatchShopProfile(csResults, partsCatalog) {
  const invoiceTotal = csResults.reduce((s, r) => s + (r.invoice_total || 0), 0);
  const costTotal = csResults.reduce((s, r) => s + (r.total_cost || 0), 0);
  const dates = csResults.map(r => r.check_in_ts).filter(Boolean).sort();

  const overall = {
    ro_count: csResults.length,
    avg_ro_value: csResults.length ? invoiceTotal / csResults.length : 0,
    overall_margin_pct: invoiceTotal ? ((invoiceTotal - costTotal) / invoiceTotal) * 100 : 0,
    date_range: dates.length ? [dates[0].slice(0, 10), dates[dates.length - 1].slice(0, 10)] : ['—', '—'],
  };

  const jobsAll = csResults.flatMap(r => r.entities?.repair_job || []);
  const top_repair_jobs = topN(jobsAll, 15).map(d => ({ job: d.name, count: d.value }));

  const partsAll = csResults.flatMap(r => (r.entities?.repair || []).map(s => s.toLowerCase().trim()));
  const top_parts = csTopParts(partsAll, 15, partsCatalog);

  // Repeat customers, scoped to who actually shows up more than once in this batch sample
  const byCustomer = {};
  csResults.forEach(r => {
    if (!r.customer_id) return;
    byCustomer[r.customer_id] = byCustomer[r.customer_id] ||
      { name: r.customer_name || r.customer_id, visit_count: 0, lifetime_spend: 0, ros: [] };
    const c = byCustomer[r.customer_id];
    c.visit_count += 1;
    c.lifetime_spend += (r.invoice_total || 0);
    c.ros.push(r);
  });
  const repeatIds = Object.keys(byCustomer).filter(id => byCustomer[id].visit_count >= 2);
  overall.repeat_customer_count = repeatIds.length;
  const top_repeat_customers = repeatIds
    .map(id => byCustomer[id])
    .sort((a, b) => b.lifetime_spend - a.lifetime_spend)
    .slice(0, 15)
    .map(c => ({ name: c.name, customer_since: '—', visit_count: c.visit_count, lifetime_spend: c.lifetime_spend }));

  const repeatJobsAll = repeatIds.flatMap(id => byCustomer[id].ros.flatMap(r => r.entities?.repair_job || []));
  const top_jobs_repeat_customers = topN(repeatJobsAll, 15).map(d => ({ job: d.name, count: d.value }));

  // Seasonal profile — same lift-index idea as the Ground Truth backend, computed
  // here over LLM-extracted entities instead of the dataset's ground-truth fields.
  const bySeasonResults = {};
  CS_SEASON_DEFS.forEach(s => { bySeasonResults[s.name] = []; });
  csResults.forEach(r => {
    const m = monthOf(r.check_in_ts);
    const season = CS_SEASON_DEFS.find(s => s.months.has(m));
    if (season) bySeasonResults[season.name].push(r);
  });

  const jobTotalCount = countBy(jobsAll);
  const partTotalCount = countBy(partsAll);

  const seasonal_profile = CS_SEASON_DEFS.map(s => {
    const seasonResults = bySeasonResults[s.name];
    const seasonJobs = seasonResults.flatMap(r => r.entities?.repair_job || []);
    const seasonParts = seasonResults.flatMap(r => (r.entities?.repair || []).map(x => x.toLowerCase().trim()));

    const recommended_focus = csSeasonalLift(
      { job: countBy(seasonJobs), part: countBy(seasonParts) },
      { job: jobTotalCount, part: partTotalCount },
      { job: csResults.length, part: partsAll.length, job_season: seasonResults.length, part_season: seasonParts.length },
    );

    return {
      name: s.name,
      range: s.range,
      ro_count: seasonResults.length,
      top_repair_jobs: topN(seasonJobs, 5).map(d => ({ job: d.name, count: d.value })),
      top_parts: csTopParts(seasonParts, 5, partsCatalog),
      recommended_focus,
    };
  });

  return { overall, top_repair_jobs, top_parts, top_repeat_customers, top_jobs_repeat_customers, seasonal_profile };
}

// ─── Shop Profile: shared render body (both modes) ──────────────────────────

function ShopProfileBody({ overall, top_repair_jobs, top_parts, top_repeat_customers, top_jobs_repeat_customers, seasonal_profile }) {
  const cardCls = "bg-slate-800 rounded-xl p-4 border border-slate-700";
  const fmtMaybeCost = v => v == null ? '—' : fmtCost(v);
  const fmtMaybePct = v => v == null ? '—' : `${v}%`;

  return (
    <div className="space-y-4">

      {/* Overall metrics */}
      <div className="grid grid-cols-5 gap-3">
        <MetricCard label="Repair Orders" value={overall.ro_count.toLocaleString()} color="#38bdf8" />
        {overall.customer_count != null
          ? <MetricCard label="Customers" value={overall.customer_count.toLocaleString()} color="#a78bfa" />
          : <MetricCard label="Repeat Customers" value={overall.repeat_customer_count ?? 0} color="#a78bfa" />}
        <MetricCard label="Avg RO Value" value={fmtCost(overall.avg_ro_value)} color="#34d399" />
        <MetricCard label="Overall Margin" value={`${Math.round(overall.overall_margin_pct * 10) / 10}%`} color="#fbbf24" />
        <MetricCard label="Date Range" value={overall.date_range[0]} sub={`→ ${overall.date_range[1]}`} color="#94a3b8" />
      </div>

      {/* Top repair jobs / top parts */}
      <div className="grid grid-cols-2 gap-4">
        <div className={cardCls}>
          <div className="text-xs font-semibold text-sky-400 mb-3">Top Repair Jobs</div>
          <HBar data={top_repair_jobs.map(j => ({ name: j.job, value: j.count }))} color="#38bdf8" emptyMsg="No repair jobs yet." />
        </div>
        <div className={cardCls}>
          <div className="text-xs font-semibold text-amber-400 mb-3">Top Parts — Supplier, Price &amp; Margin</div>
          <ShopTable
            emptyMsg="No parts data yet."
            columns={[
              { key: 'name', label: 'Part' },
              { key: 'preferred_supplier', label: 'Preferred Supplier' },
              { key: 'avg_price', label: 'Avg Price', align: 'right', render: r => fmtMaybeCost(r.avg_price) },
              { key: 'margin_pct', label: 'Margin', align: 'right', render: r => fmtMaybePct(r.margin_pct) },
            ]}
            rows={top_parts}
          />
        </div>
      </div>

      {/* Top repeat customers / top jobs by repeat customers */}
      <div className="grid grid-cols-2 gap-4">
        <div className={cardCls}>
          <div className="text-xs font-semibold text-violet-400 mb-3">Top Repeat Customers</div>
          <ShopTable
            emptyMsg="No repeat customers yet."
            columns={[
              { key: 'name', label: 'Customer' },
              { key: 'customer_since', label: 'Since' },
              { key: 'visit_count', label: 'Visits', align: 'right' },
              { key: 'lifetime_spend', label: 'Lifetime Spend', align: 'right', render: r => fmtCost(r.lifetime_spend) },
            ]}
            rows={top_repeat_customers}
          />
        </div>
        <div className={cardCls}>
          <div className="text-xs font-semibold text-emerald-400 mb-3">Top Jobs by Repeat Customers</div>
          <HBar data={top_jobs_repeat_customers.map(j => ({ name: j.job, value: j.count }))} color="#34d399" emptyMsg="No repeat-customer jobs yet." />
        </div>
      </div>

      {/* Seasonal trends */}
      <div className={cardCls}>
        <div className="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Seasonal Trends — top jobs, parts &amp; recommended focus by season</div>
        <div className="text-xs text-slate-500 mb-3">
          Recommended focus = jobs/parts that occur disproportionately more often in that season than their year-round average (e.g. "2.5×" means 2.5x more common in that season).
        </div>
        <SeasonalProfileGrid data={seasonal_profile} />
      </div>

    </div>
  );
}

function ShopProfileTab({ batchResults }) {
  const [mode, setMode] = useState('batch_ner'); // 'ground_truth' | 'batch_ner'
  const [profile, setProfile] = useState(null);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    fetch('/api/shop_profile')
      .then(r => r.json())
      .then(setProfile)
      .catch(() => setProfile({ shop: null }))
      .finally(() => setLoading(false));
  }, []);

  const csResults = useMemo(() => batchResults.filter(r => r.datasource === 'cornerstone'), [batchResults]);
  const batchProfile = useMemo(() => buildBatchShopProfile(csResults, profile?.parts_catalog), [csResults, profile]);

  if (loading) {
    return <div className="text-slate-500 text-sm text-center py-20">Loading shop profile…</div>;
  }
  if (!profile || !profile.shop) {
    return (
      <div className="text-slate-500 text-sm text-center py-20">
        No shop-profile dataset found. Run <code className="text-slate-400">build_shop_synthetic.py</code> to generate one.
      </div>
    );
  }

  const { shop } = profile;
  const cardCls = "bg-slate-800 rounded-xl p-4 border border-slate-700";

  return (
    <div className="space-y-4">

      {/* Shop header */}
      <div className={`${cardCls} flex items-center justify-between flex-wrap gap-3`}>
        <div>
          <div className="text-slate-100 text-base font-semibold">🏪 {shop.name}</div>
          <div className="text-xs text-slate-500 mt-0.5">
            {shop.address}, {shop.city}, {shop.state} {shop.zip} · {shop.phone} · {shop.hours}
          </div>
        </div>
        <div className="text-xs text-slate-500">
          {shop.bays.length} bays · {shop.technicians.length} technicians
        </div>
      </div>

      {/* Mode toggle */}
      <div className="flex rounded-lg overflow-hidden border border-slate-700 text-xs font-semibold w-fit">
        {[['ground_truth', '✅ Ground Truth'], ['batch_ner', '🤖 From Batch NER']].map(([m, lbl]) => (
          <button key={m} onClick={() => setMode(m)}
            className={`px-4 py-1.5 transition-colors ${mode === m ? 'bg-blue-600 text-white' : 'bg-slate-900 text-slate-400 hover:text-slate-200'}`}>
            {lbl}
          </button>
        ))}
      </div>

      {mode === 'ground_truth' && (
        <ShopProfileBody
          overall={profile.overall}
          top_repair_jobs={profile.top_repair_jobs}
          top_parts={profile.top_parts}
          top_repeat_customers={profile.top_repeat_customers}
          top_jobs_repeat_customers={profile.top_jobs_repeat_customers}
          seasonal_profile={profile.seasonal_profile}
        />
      )}

      {mode === 'batch_ner' && (
        csResults.length === 0 ? (
          <div className="text-slate-500 text-sm text-center py-20">
            No data yet — run a Batch from the Batch tab (select the <code className="text-slate-400">cornerstone</code> datasource)
            to compute this from actual LLM extraction.
          </div>
        ) : (
          <>
            <div className="text-xs text-slate-500 -mt-2">
              Computed from {csResults.length.toLocaleString()} Cornerstone samples run through the LLM in the Batch tab — not the dataset's ground-truth labels.
            </div>
            <ShopProfileBody {...batchProfile} />
          </>
        )
      )}

    </div>
  );
}

// ─── App ──────────────────────────────────────────────────────────────────────

const TABS = [
  { id: 'live',          label: '⚡ Live NER + Forecast' },
  { id: 'batch',         label: '⚙ Batch' },
  { id: 'analytics',     label: '📊 Analytics' },
  { id: 'parts_forecast_analytics', label: '📈 Parts Forecast Analytics' },
  { id: 'technician_skill', label: '🔧 Technician Skill Model' },
  { id: 'relationships', label: '🕸 Top N Clusters' },
  { id: 'pipeline',      label: '🔬 Pipeline & Cost' },
  { id: 'strategy',      label: '🗺 Strategy' },
  { id: 'shop',          label: '🏪 Shop Profile' },
];

// ─── DatasourceDropdown ───────────────────────────────────────────────────────
// Shared multi-select dropdown for choosing active datasources. Collapsed by
// default, showing a summary ("All datasources" / id / "N datasources");
// click to open a checklist, click outside to close.

function DatasourceDropdown({ availableDs, selectedDs, toggleDs, clearDs }) {
  const [open, setOpen] = useState(false);
  const wrapRef = useRef(null);

  useEffect(() => {
    if (!open) return;
    const onDocClick = (e) => { if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', onDocClick);
    return () => document.removeEventListener('mousedown', onDocClick);
  }, [open]);

  const summary = selectedDs.size === 0
    ? 'All datasources'
    : selectedDs.size === 1
      ? [...selectedDs][0]
      : `${selectedDs.size} datasources`;

  return (
    <div className="relative inline-block" ref={wrapRef}>
      <button type="button" onClick={() => setOpen(o => !o)}
        className="text-xs px-3 py-1.5 rounded-lg border border-slate-600 bg-slate-900 text-slate-300 hover:border-blue-500 hover:text-blue-300 font-mono flex items-center gap-2">
        <span>{summary}</span>
        <span className="text-slate-500">▾</span>
      </button>
      {open && (
        <div className="absolute z-50 mt-1 w-64 bg-slate-800 border border-slate-700 rounded-lg shadow-xl p-2">
          {availableDs.length === 0 && (
            <div className="text-xs text-slate-600 italic px-2 py-1">No datasources loaded.</div>
          )}
          <div className="max-h-64 overflow-y-auto space-y-1">
            {availableDs.map(ds => {
              const checked = selectedDs.has(ds.id);
              return (
                <label key={ds.id} className="flex items-center gap-2 px-2 py-1 rounded hover:bg-slate-700 cursor-pointer">
                  <input
                    type="checkbox"
                    checked={checked}
                    onChange={() => toggleDs(ds.id)}
                    className="w-3.5 h-3.5 rounded accent-blue-500"
                  />
                  <span className={`text-xs font-mono flex-1 ${checked ? 'text-slate-200' : 'text-slate-400'}`}>
                    {ds.id}
                  </span>
                  <span className="text-[10px] text-slate-600">
                    {ds.count >= 1000 ? `${(ds.count / 1000).toFixed(0)}k` : ds.count}
                  </span>
                </label>
              );
            })}
          </div>
          {selectedDs.size > 0 && (
            <button onClick={clearDs} className="mt-2 w-full text-left text-xs text-slate-500 hover:text-slate-300 underline px-2">
              Clear selection (use all)
            </button>
          )}
        </div>
      )}
    </div>
  );
}

// ─── SettingsPanel ────────────────────────────────────────────────────────────

function SettingsPanel({ open, onClose, availableDs, selectedDs, toggleDs, clearDs }) {
  if (!open) return null;
  return (
    <>
      {/* Backdrop */}
      <div onClick={onClose} style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.45)', zIndex: 40 }} />
      {/* Panel */}
      <div style={{
        position: 'fixed', top: 0, right: 0, bottom: 0, width: 320, zIndex: 50,
        background: '#1e293b', borderLeft: '1px solid #334155',
        display: 'flex', flexDirection: 'column',
      }}>
        <div className="flex items-center justify-between px-5 py-4 border-b border-slate-700">
          <span className="text-sm font-semibold text-slate-200">Settings</span>
          <button onClick={onClose} className="text-slate-400 hover:text-slate-200 text-lg leading-none">✕</button>
        </div>
        <div className="flex-1 overflow-y-auto px-5 py-4 space-y-6">

          {/* Datasources */}
          <div>
            <div className="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">Datasources</div>
            <div className="text-xs text-slate-500 mb-3">
              Select which datasources are active. Applies to both Live NER and Batch tabs.
              All unselected = all datasources used.
            </div>
            <DatasourceDropdown availableDs={availableDs} selectedDs={selectedDs} toggleDs={toggleDs} clearDs={clearDs} />
          </div>

        </div>
      </div>
    </>
  );
}

// Deep-link support: ?ds=cornerstone (or ?datasource=cornerstone, comma-separated
// for multiple) pre-selects datasource(s) on load; ?tab=live picks the starting tab.
// Lets another app link straight into e.g. /?ds=cornerstone&tab=live.
function getUrlParams() {
  const p = new URLSearchParams(window.location.search);
  const dsParam = p.get('ds') || p.get('datasource') || '';
  return {
    tab: p.get('tab') || 'live',
    ds: dsParam ? dsParam.split(',').map(s => s.trim()).filter(Boolean) : [],
  };
}

function App() {
  const urlParams = useMemo(() => getUrlParams(), []);
  const [tab, setTab] = useState(urlParams.tab);
  const [health, setHealth] = useState(null);
  const [settingsOpen, setSettingsOpen] = useState(false);
  const { theme, toggle: toggleTheme } = useTheme();

  // Global datasource state — shared across Live + Batch tabs
  const [availableDs, setAvailableDs] = useState([]);
  const [selectedDs, setSelectedDs] = useState(() => new Set(urlParams.ds));

  const toggleDs = (id) => setSelectedDs(prev => {
    const next = new Set(prev);
    if (next.has(id)) next.delete(id); else next.add(id);
    return next;
  });
  const clearDs = () => setSelectedDs(new Set());

  // Batch state lives here so the stream loop survives tab switches
  const [batchResults,  setBatchResults]  = useState([]);
  const [batchRunning,  setBatchRunning]  = useState(false);
  const [batchProgress, setBatchProgress] = useState({ completed: 0, total: 0 });
  const batchAbortRef = useRef(null);

  useEffect(() => {
    fetch('/api/health').then(r => r.json()).then(setHealth).catch(() => {});
    fetch('/api/datasources').then(r => r.json()).then(setAvailableDs).catch(() => {});
  }, []);

  const pct = batchProgress.total ? Math.round((batchProgress.completed / batchProgress.total) * 100) : 0;

  return (
    <div className="min-h-screen flex flex-col">
      {/* Header */}
      <header className="bg-slate-800 border-b border-slate-700 px-6 py-3 flex items-center justify-between">
        <div className="flex items-center gap-3">
          <img src="/predii_logo.png" alt="Predii" style={{ height: '28px', width: 'auto' }} />
          <div className="text-slate-600 text-lg">|</div>
          <div className="text-slate-200 text-sm font-medium">Predii360 Pipeline for Repair Orders</div>
        </div>
        <div className="flex items-center gap-6 text-xs text-slate-400">
          {batchRunning && (
            <span className="flex items-center gap-2 text-blue-400">
              <span className="spinner" />
              {batchProgress.completed} / {batchProgress.total} ({pct}%)
            </span>
          )}
          {health && (
            <>
              <span>{health.samples?.toLocaleString()} samples loaded</span>
              <span className="flex items-center gap-1.5">
                <span className={`w-2 h-2 rounded-full ${health.llm_ok ? 'bg-emerald-400' : 'bg-red-400'}`} />
                LLM {health.llm_ok ? 'online' : 'offline'} · {health.llm_url}
              </span>
            </>
          )}
          <button
            onClick={toggleTheme}
            title={theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'}
            className="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-slate-700 text-slate-400 hover:text-slate-200 transition-colors"
            style={{ fontSize: 16 }}
          >{theme === 'dark' ? '☀' : '🌙'}</button>
          <button
            onClick={() => setSettingsOpen(true)}
            title="Settings"
            className="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-slate-700 text-slate-400 hover:text-slate-200 transition-colors"
            style={{ fontSize: 18 }}
          >⚙</button>
        </div>
      </header>
      <SettingsPanel
        open={settingsOpen} onClose={() => setSettingsOpen(false)}
        availableDs={availableDs} selectedDs={selectedDs}
        toggleDs={toggleDs} clearDs={clearDs}
      />

      {/* Tab nav */}
      <nav className="bg-slate-800 border-b border-slate-700 px-6 flex gap-1 pt-2 overflow-x-auto">
        {TABS.map(t => (
          <button
            key={t.id}
            onClick={() => setTab(t.id)}
            className={`tab-btn px-4 py-2 text-sm rounded-t-lg border-b-2 -mb-px flex items-center gap-1.5 flex-shrink-0 whitespace-nowrap ${
              tab === t.id
                ? 'border-blue-400 text-blue-300 bg-slate-900'
                : 'border-transparent text-slate-400 hover:text-slate-200 hover:bg-slate-700'
            }`}
          >
            {t.label}
            {t.id === 'batch' && batchRunning && (
              <span className="w-1.5 h-1.5 rounded-full bg-blue-400 animate-pulse" />
            )}
            {(t.id === 'analytics' || t.id === 'relationships') && batchRunning && (
              <span className="text-xs font-mono text-blue-500">{batchResults.length}</span>
            )}
            {t.id === 'shop' && batchRunning && (
              <span className="text-xs font-mono text-blue-500">
                {batchResults.filter(r => r.datasource === 'cornerstone').length}
              </span>
            )}
          </button>
        ))}
      </nav>

      {/* Content */}
      <main className="flex-1 p-6 overflow-y-auto" style={{ maxHeight: 'calc(100vh - 96px)' }}>
        {tab === 'live'          && <LiveTab selectedDs={selectedDs} availableDs={availableDs} toggleDs={toggleDs} clearDs={clearDs} defaultMode={urlParams.ds.length ? 'raw' : 'demo'} />}
        {tab === 'batch'         && <BatchTab
                                      running={batchRunning}    setRunning={setBatchRunning}
                                      progress={batchProgress}  setProgress={setBatchProgress}
                                      results={batchResults}    setResults={setBatchResults}
                                      abortRef={batchAbortRef}
                                      selectedDs={selectedDs}   availableDs={availableDs} />}
        {tab === 'analytics'     && <AnalyticsTab batchResults={batchResults} />}
        {tab === 'parts_forecast_analytics' && <PartsForecastAnalyticsTab batchResults={batchResults} />}
        {tab === 'technician_skill' && <TechnicianSkillModelTab batchResults={batchResults} />}
        {tab === 'relationships' && <RelationshipsTab batchResults={batchResults} />}
        {tab === 'pipeline'      && <PipelineTab />}
        {tab === 'strategy'      && <StrategyTab />}
        {tab === 'shop'          && <ShopProfileTab batchResults={batchResults} />}
      </main>
    </div>
  );
}

createRoot(document.getElementById('root')).render(<ThemeProvider><App /></ThemeProvider>);
</script>
</body>
</html>
